<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jissr: your result</title>
<link rel="stylesheet" href="styles.css">
<style>
body{font-size:17px}
.wrap{max-width:540px}
.view{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--brand);font:inherit;font-weight:600;padding:10px 0;cursor:pointer;min-height:44px}
[dir=rtl] .back .ico{transform:scaleX(-1)}
.hello{font-size:2.15rem;margin:8px 0 2px}
/* journey tracker */
.track{display:flex;margin:18px 0 6px}
.trk{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--muted)}
.trk .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;background:var(--card);border:2px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative;z-index:1}
.trk:not(:last-child):after{content:"";position:absolute;top:12px;inset-inline-start:50%;width:100%;height:2px;background:var(--line)}
.trk.done .dot{background:var(--brand);border-color:var(--brand);color:var(--card)}
.trk.done:not(:last-child):after{background:var(--brand)}
.trk.now .dot{border-color:var(--accent);background:var(--accent);color:#1b2238;animation:ring 2s ease-in-out infinite}
.trk.now{color:var(--ink);font-weight:600}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(208,138,46,.5)}50%{box-shadow:0 0 0 8px rgba(208,138,46,0)}}
/* the one thing to do next */
.next{background:var(--panel);background-image:var(--star);color:var(--on-panel);border-radius:22px;padding:24px 22px;margin:16px 0;overflow:hidden}
.next.ok{background-color:#24573f}
.next .badge{width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(255,252,246,.55);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.next h2{font-size:1.6rem;margin:0 0 8px;color:var(--on-panel)}
.next p{margin:0 0 18px;opacity:.93}
.next .btn{background:var(--accent);border-color:var(--accent);color:#1b2238;width:100%;font-size:1.05rem}
.next.wait .btn,.next.ok .btn{background:transparent;color:var(--on-panel);border-color:rgba(255,252,246,.7)}
/* who is looking after me */
.who{display:flex;gap:14px;align-items:center;margin-top:10px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:1.1rem;flex:none}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 6px 12px;text-align:center;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;min-height:92px;line-height:1.3;transition:border-color .15s}
.act:hover{border-color:var(--brand)}
.act .ico{display:block;margin:0 auto 8px;color:var(--brand)}
.scale{display:flex;gap:8px}
.scale button{flex:1;font:inherit;font-weight:600;font-size:1.05rem;padding:12px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;min-height:52px}
.scale button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--card)}
.tick{width:84px;height:84px;border-radius:50%;background:var(--green);margin:10px auto;display:flex;align-items:center;justify-content:center;color:#fffcf6;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.tick svg{width:44px;height:44px;stroke-width:2.4;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s ease forwards}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.center{text-align:center}
.bigbtn{width:100%;font-size:1.08rem;min-height:56px}
.slotbtn{padding:14px 8px}
.bubble{background:var(--green-l);color:var(--ink);border-radius:16px 16px 16px 4px;padding:12px 14px;margin:8px 0;max-width:92%}
[dir=rtl] .bubble{border-radius:16px 16px 4px 16px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
[dir=rtl] .lbl{letter-spacing:0;text-transform:none;font-size:13px}
</style>
</head>
<body>
<div class="demo">
  <span>Demo · synthetic data only</span>
  <span class="row">
    <label for="who" style="margin:0;font-weight:400">Viewing as</label>
    <select id="who" style="width:auto"></select>
    <button id="reset">Reset demo</button>
    <a href="index.html">Home</a>
  </span>
</div>
<div class="wrap" id="app" aria-live="polite"></div>

<script type="module">

import { ic, wordmark } from './core/ui.mjs';

    chanQ: 'كيف تفضل أن نتواصل معك؟', chan: { app: 'هذا التطبيق', sms: 'رسالة نصية', whatsapp: 'واتساب', phone: 'اتصال هاتفي' },
    preview: 'هكذا ستبدو رسالتنا إليك (تجريبي):', previewMsg: 'جسر: نتيجتك جاهزة. اضغط لتقرأها بكلمات بسيطة. لا نكتب رقم نتيجتك في الرسائل أبداً. هذا ليس تشخيصاً.',

    famName: 'اسمه', famRel: 'من هو؟ (ابنتي، ابني، صديق…)', famOn: 'شارك حالة موعدي', famDone: (n) => `سيرى ${n} حالة موعدك والتذكيرات فقط.`, famOff: 'إيقاف المشاركة',
    famPreview: 'ما سيصله:', famMsg: 'تم شرح نتيجة والدتك وحجز موعدها.',
    confLow: 'لست متأكداً', confHigh: 'متأكد جداً',
    confQ: 'ما مدى ثقتك بما سيحدث بعد ذلك؟', confThanks: 'شكراً لك. هذا يساعدنا على التحسين.',
    seeStaff: 'شاهد هذه الحالة في شاشة الفريق',

/* ---------- state ---------- */
let state = loadState();
const params = new URLSearchParams(location.search);
let id = params.get('p') || 'C-001';
let lang = params.get('lang') || (() => { try { return localStorage.getItem('jissr.lang') || 'en'; } catch { return 'en'; } })();
let view = 'home';       // home | result | book | nurse | family
let level = 'normal';
let speaking = false;
let msg = {};            // small, temporary screen state
let aiBox = {};          // AI or template text already shown, by key
const patientActor = () => ({ type: 'patient', name: 'Patient (in app)' });
const sysActor = { type: 'system', name: 'Jissr system' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = () => state.cases.find((c) => c.id === id) || state.cases[0];
const save = () => saveState(state);
const T = () => S[lang];
const loc = () => (lang === 'ar' ? 'ar-AE' : 'en-GB');
const fmtDay = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const staffOf = (sid) => state.staff.find((s) => s.id === sid);
const stageIdx = (c) => ['result', 'notified', 'understood', 'booked', 'attended', 'confirmed', 'referred', 'care_plan', 'closed'].indexOf(c.stage);

// Opening the app counts as "patient notified" in this demo.
function ensureNotified() {
  const c = cur();
  if (c.stage === 'result') { advance(state, c.id, 'notified', sysActor, 'Opened the result in the patient app (demo)'); save(); }
}

/* ---------- the explanation text: pre-written first, AI wording swapped in if it arrives ---------- */
function explainNow(c) {
  const key = `${c.id}|${lang}|${level}|explain`;
  if (aiBox[key]) return aiBox[key];
  const t = { text: explanation({ band: c.band, value: c.value, lang, level }), source: 'template' };
  aiBox[key] = t;
  aiText({ band: c.band, value: c.value, lang, level }).then((r) => {
    if (r.source === 'ai') { aiBox[key] = r; recordAiText(state, c.id, r.text, 'ai'); save(); render(); }
  });
  recordAiText(state, c.id, t.text, 'template'); save();
  return t;
}
function barrierNow(c) {
  const key = `${c.id}|${lang}|${c.barrier}|barrier`;
  if (aiBox[key]) return aiBox[key];
  const t = { text: barrierText(c.barrier, lang), source: 'template' };
  aiBox[key] = t;
  if (c.barrier !== 'none') aiText({ task: 'barrier', band: c.band, value: c.value, lang, barrier: c.barrier }).then((r) => {
    if (r.source === 'ai') { aiBox[key] = r; render(); }
  });
  return t;
}

/* ---------- pieces ---------- */
const tickHtml = () => `<div class="tick" aria-hidden="true">${ic('check', 44)}</div>`;
const initials = (n) => n.replace(/\((.*?)\)/g, '').split(/\s+/).filter((w) => !/^(Nurse|Dr)$/i.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const topBar = () => `<div class="top"><div class="brand">${wordmark()}</div>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="${lang === 'en'}">English</button>
    <button data-lang="ar" aria-pressed="${lang === 'ar'}">العربية</button>
  </div></div>`;

// where the patient is on the journey (0..4), or 5 when everything is done
function journeyStep(c) {
  switch (c.stage) {
    case 'closed': return 5;
    case 'result': case 'notified': return 0;
    case 'understood': return 1;
    case 'booked': return 2;
    case 'attended': case 'confirmed': case 'referred': return 3;
    default: return 4; // care_plan
  }
}
function trackerHtml(c) {
  const now = journeyStep(c);
  return `<div class="track" role="list" aria-label="Your journey">${T().steps.map((l, i) => {
    const cls = i < now ? 'done' : i === now ? 'now' : '';
    return `<div class="trk ${cls}" role="listitem"><div class="dot">${i < now ? ic('check', 14) : i + 1}</div>${l}</div>`;
  }).join('')}</div>`;
}

// the one big card: what happens next, in one sentence, with one button
function nextCard(c) {
  const t = T(), n = t.n;
  const slotTxt = c.slot ? `${fmtDay(c.slot.day)}, ${c.slot.time}` : '';
  const r = c.referral;
  let d, action = 'nurse', cls = 'wait';
  switch (c.stage) {
    case 'result': case 'notified': d = n.read; action = 'result'; cls = ''; break;
    case 'understood': d = n.book; action = 'book'; cls = ''; break;
    case 'booked': d = n.booked(slotTxt || '…'); action = c.slot ? 'ics' : 'none'; cls = 'ok'; break;
    case 'attended': d = n.attended; break;
    case 'confirmed': d = n.confirmed; break;
    case 'referred': {
      const owner = staffOf(c.owner);
      if (!r) d = n.confirmed;
      else if (r.status === 'sent') d = n.sent(r.to);
      else if (r.status === 'accepted') d = n.accepted(r.to, owner ? owner.name : '');
      else if (r.status === 'rejected') d = n.rejected;
      else d = n.completed;
      break;
    }
    case 'care_plan': d = c.plan && c.plan.kind === 'surveillance' ? n.surv : n.treat; break;
    default: d = n.done; action = 'none'; cls = 'ok';
  }
  const [ico, title, sub, btn] = d;
  return `<section class="next ${cls}"><div class="badge">${ic(ico, 26)}</div><h2>${esc(title)}</h2><p>${esc(sub)}</p>
    ${btn && action !== 'none' ? `<button class="btn" id="next-go" data-a="${action}">${btn}</button>` : ''}</section>`;
}

function contactCard(c) {
  const t = T(), o = staffOf(c.owner);
  return `<section class="card"><div class="lbl">${t.careBy}</div>
    ${o ? `<div class="who"><div class="avatar" aria-hidden="true">${esc(initials(o.name))}</div>
      <div><b>${esc(o.name)}</b><br><span class="muted">${t.role[o.role]} · ${esc(o.org)}</span></div></div>`
      : `<p style="margin-bottom:0">${t.noOwner}</p>`}
  </section>`;
}

/* ---------- views ---------- */
function homeView(c) {
  const t = T();
  const first = c.patient.name.split(' ')[0];
  let h = `${topBar()}<div class="view">
    <h1 class="hello">${esc(t.hello(first))}</h1>
    ${trackerHtml(c)}
    ${nextCard(c)}
    ${contactCard(c)}
    <div class="actions">
      <button class="act" data-go="result">${ic('speaker', 24)}${t.qListen}</button>
      <button class="act" data-go="nurse">${ic('phone', 24)}${t.qNurse}</button>
      <button class="act" data-go="family">${ic('users', 24)}${t.qFamily}</button>
    </div>`;
  if (stageIdx(c) >= 3 && c.stage !== 'closed') {
    h += `<section class="card"><h3>${t.confQ}</h3><div class="scale">${[1, 2, 3, 4, 5].map((n) => `<button data-conf="${n}" aria-label="${n}" aria-pressed="${!!c.confidence && c.confidence.score === n}">${n}</button>`).join('')}</div>
      <div class="row tiny muted" style="justify-content:space-between;margin-top:6px"><span>${t.confLow}</span><span>${t.confHigh}</span></div>
      ${msg.confDone ? `<div class="ok-msg" style="margin-bottom:0">${t.confThanks}</div>` : ''}</section>`;
  }
  h += `<p class="foot"><a href="staff.html?c=${esc(c.id)}">${t.seeStaff}</a><br>Synthetic demo · not medical advice</p></div>`;
  return h;
}

function resultView(c) {
  const t = T();
  const ex = explainNow(c);
  const cls = classify(c.value);
  const understood = stageIdx(c) >= 2;
  return `${topBar()}<div class="view"><button class="back" data-go="home">${ic('back', 18)}${t.back}</button>
    <section class="card"><div class="lbl">${t.yourTest}</div>
      <div class="big">${cls.value}<span style="font-size:1.4rem"> %</span></div>
      <span class="chip ${cls.urgency}">${t.band[cls.band]}</span>
      <p style="margin-top:12px;font-size:1.05em">${esc(ex.text)}</p>
      <div class="notdx" role="note">${ic('shield', 22)}<span>${t.notdx}</span></div>
      <div class="row">
        ${'speechSynthesis' in window ? `<button class="btn ghost small" id="listen">${speaking ? ic('stop', 16) + ' ' + t.stop : ic('speaker', 16) + ' ' + t.listen}</button>` : ''}
        ${level === 'normal' ? `<button class="btn ghost small" id="simpler">${t.simpler}</button>` : ''}
      </div>
      <div class="tag">${ex.source === 'ai' ? t.ai : t.tpl}</div>
    </section>
    <section class="card center"><h2>${t.sense}</h2>
      ${understood ? `${tickHtml()}<p class="ok-msg">${t.thanks}</p><button class="btn bigbtn" data-go="home">${t.cont}</button>`
        : msg.no ? `<p class="muted">${t.noHelp}</p><div class="row" style="justify-content:center"><button class="btn" id="yes">${t.yes}</button><button class="btn ghost" data-go="nurse">${t.qNurse}</button></div>`
        : `<div class="row" style="justify-content:center"><button class="btn bigbtn" id="yes">${t.yes}</button><button class="btn ghost bigbtn" id="no">${t.no}</button></div>`}
    </section></div>`;
}

function bookView(c) {
  const t = T();
  const booked = stageIdx(c) >= 3;
  if (booked) {
    return `${topBar()}<div class="view center">${tickHtml()}<h1>${t.booked}</h1>
      ${c.slot ? `<p style="font-size:1.25rem"><b>${fmtDay(c.slot.day)} · ${c.slot.time}</b></p>` : ''}
      <p class="muted">${t.where}</p>
      <label style="display:flex;gap:10px;align-items:center;justify-content:center;font-weight:400"><input type="checkbox" id="rem" style="width:auto" ${c.reminder ? 'checked' : ''}> ${t.remind}</label>
      ${c.reminder ? `<div class="ok-msg">${t.remindOn}</div>` : ''}
      ${c.slot ? `<p><button class="btn ghost" id="ics">${ic('calendar', 18)} ${t.cal}</button></p>` : ''}
      <p><button class="btn bigbtn" data-go="home">${t.home}</button></p></div>`;
  }
  const bar = barrierNow(c);
  const slots = slotsFor({ band: c.band, barrier: c.barrier }, state.today);
  return `${topBar()}<div class="view"><button class="back" data-go="home">${ic('back', 18)}${t.back}</button>
    <section class="card"><h2>${t.barrierQ}</h2><p class="muted">${t.barrierSub}</p>
      <div class="chips">${BARRIERS.map((b) => `<button class="pick" data-b="${b}" aria-pressed="${c.barrier === b}">${t.barrier[b]}</button>`).join('')}</div>
      ${c.barrier !== 'none' ? `<div class="card soft" style="margin-bottom:0"><p style="margin-top:0">${esc(bar.text)}</p><div class="tag">${bar.source === 'ai' ? t.ai : t.tpl}</div>
        ${['fear', 'cost', 'language', 'dont_understand'].includes(c.barrier) ? `<button class="btn small" data-go="nurse">${ic('phone', 16)} ${t.qNurse}</button>` : ''}</div>` : ''}
    </section>
    <section class="card"><h2>${t.pick}</h2>
      <div class="slots">${slots.map((s, i) => `<button class="pick slotbtn" data-slot="${i}" aria-pressed="${msg.slot === i}">${fmtDay(s.day)}<br><b>${s.time}</b></button>`).join('')}</div>
      <p><button class="btn bigbtn" id="confirm" ${msg.slot == null ? 'disabled' : ''}>${t.confirm}</button></p>
    </section></div>`;
}

function nurseView(c) {
  const t = T();
  const waiting = c.nurseRequest && !c.nurseRequest.done;
  return `${topBar()}<div class="view"><button class="back" data-go="home">${ic('back', 18)}${t.back}</button>
    <section class="card"><h2>${ic('phone', 22)} ${t.nurseT}</h2><p class="muted">${t.nurseSub}</p>
      ${waiting ? `${tickHtml()}<div class="ok-msg">${t.asked}<br><span class="tiny">${nurseText(lang)}</span></div>`
        : `<label for="nw">${t.when}</label><select id="nw"><option value="morning">${t.morning}</option><option value="afternoon">${t.afternoon}</option><option value="evening">${t.evening}</option></select>
        <label>${t.chanQ}</label><div class="chips">${['app', 'sms', 'whatsapp', 'phone'].map((k) => `<button class="pick" data-ch="${k}" aria-pressed="${c.channel === k}">${t.chan[k]}</button>`).join('')}</div>
        ${['sms', 'whatsapp'].includes(c.channel) ? `<div class="tiny muted" style="margin-top:8px">${t.preview}</div><div class="bubble">${t.previewMsg}</div>` : ''}
        <label for="nn">${t.note}</label><textarea id="nn" maxlength="300">${esc(msg.nn || '')}</textarea>
        <p><button class="btn bigbtn" id="nurse-go">${t.ask}</button></p>`}
      <div class="sos" role="note">${ic('phone', 20)}<span>${t.sos}</span></div>
    </section></div>`;
}

function familyView(c) {
  const t = T(), fh = c.familyHelper;
  return `${topBar()}<div class="view"><button class="back" data-go="home">${ic('back', 18)}${t.back}</button>
    <section class="card"><h2>${ic('users', 22)} ${t.fam}</h2><p class="muted">${t.famSub}</p>
      ${fh && fh.consent
        ? `<div class="ok-msg">${esc(t.famDone(fh.name))}</div>
           <div class="card soft"><div class="tiny muted">${t.famPreview}</div><p style="margin-bottom:0">${t.famMsg}</p></div>
           <button class="btn ghost" id="fam-off">${t.famOff}</button>`
        : `<label for="fn">${t.famName}</label><input id="fn" maxlength="40" value="${esc(msg.fn || '')}"><label for="fr">${t.famRel}</label><input id="fr" maxlength="30" value="${esc(msg.fr || '')}">
           <p><button class="btn bigbtn" id="fam-on">${t.famOn}</button></p>`}
    </section></div>`;
}

function render() {
  const c = cur();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = 'Jissr · ' + (lang === 'ar' ? 'نتيجتك' : 'your result');
  const v = { home: homeView, result: resultView, book: bookView, nurse: nurseView, family: familyView }[view] || homeView;
  document.getElementById('app').innerHTML = v(c);
  wire(c);
}

function act(fn) { try { fn(); save(); } catch (e) { alert(e.message); } render(); }
const go = (v) => { view = v; msg = { ...msg, no: false }; stopSpeak(); window.scrollTo({ top: 0 }); render(); };

function wire(c) {
  const $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('jissr.lang', lang); } catch { } stopSpeak(); render(); });
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));
  $('#next-go') && ($('#next-go').onclick = () => { const a = $('#next-go').dataset.a; a === 'ics' ? downloadIcs() : go(a); });
  $('#listen') && ($('#listen').onclick = () => { speaking ? stopSpeak() : speak(explainNow(c).text); render(); });
  $('#simpler') && ($('#simpler').onclick = () => { level = 'simple'; render(); });
  $('#yes') && ($('#yes').onclick = () => act(() => { if (stageIdx(c) < 2) advance(state, c.id, 'understood', patientActor(), 'Patient confirmed they understood'); msg.no = false; }));
  $('#no') && ($('#no').onclick = () => { level = 'simple'; msg.no = true; act(() => { if (c.barrier === 'none') setBarrier(state, c.id, 'dont_understand', patientActor()); }); });
  document.querySelectorAll('[data-b]').forEach((b) => b.onclick = () => act(() => setBarrier(state, c.id, b.dataset.b, patientActor())));
  document.querySelectorAll('[data-slot]').forEach((b) => b.onclick = () => { msg.slot = +b.dataset.slot; render(); });
  $('#confirm') && ($('#confirm').onclick = () => {
    const s = slotsFor({ band: c.band, barrier: c.barrier }, state.today)[msg.slot];
    act(() => { advance(state, c.id, 'booked', patientActor(), `Booked ${s.day} ${s.time}`); c.slot = s; c.reminder = { when: '1 day before', at: new Date().toISOString() }; msg.slot = null; });
  });
  $('#rem') && ($('#rem').onchange = (e) => act(() => { c.reminder = e.target.checked ? { when: '1 day before', at: new Date().toISOString() } : null; }));
  $('#ics') && ($('#ics').onclick = downloadIcs);
  document.querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => { msg.nn = $('#nn') ? $('#nn').value : msg.nn; act(() => setChannel(state, c.id, b.dataset.ch, patientActor())); });
  $('#nurse-go') && ($('#nurse-go').onclick = () => act(() => requestNurse(state, c.id, patientActor(), `Preferred time: ${$('#nw').value}. ${$('#nn').value.trim()}`.trim())));
  document.querySelectorAll('[data-conf]').forEach((b) => b.onclick = () => { msg.confDone = true; act(() => recordConfidence(state, c.id, +b.dataset.conf, patientActor())); });
  $('#fam-on') && ($('#fam-on').onclick = () => {
    const n = $('#fn').value.trim();
    if (!n) { $('#fn').focus(); return; }
    act(() => { c.familyHelper = { name: n, relation: $('#fr').value.trim(), consent: true, at: new Date().toISOString() }; c.events.push({ type: 'family', at: new Date().toISOString(), by: 'Patient (in app)', role: 'patient', note: `Allowed ${n} to see appointment status (not the result)` }); msg.fn = msg.fr = ''; });
  });
  $('#fam-off') && ($('#fam-off').onclick = () => act(() => { c.familyHelper = null; c.events.push({ type: 'family', at: new Date().toISOString(), by: 'Patient (in app)', role: 'patient', note: 'Stopped sharing with family helper' }); }));
}

/* ---------- read aloud (your browser's built-in voice) ---------- */
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ar' ? 'ar-SA' : 'en-GB'; u.rate = 0.9;
    u.onend = u.onerror = () => { speaking = false; render(); };
    speaking = true; speechSynthesis.speak(u);
  } catch { speaking = false; }
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch { } speaking = false; }

/* ---------- calendar file ---------- */
function downloadIcs() {
  const c = cur(); if (!c.slot) return;
  const d = c.slot.day.replace(/-/g, ''), tm = c.slot.time.replace(':', '') + '00';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Jissr demo//EN', 'BEGIN:VEVENT', `UID:${c.id}-${d}@jissr-demo`, `DTSTAMP:${d}T000000Z`,
    `DTSTART;TZID=Asia/Dubai:${d}T${tm}`, 'DURATION:PT20M', 'SUMMARY:Jissr demo visit (HbA1c follow-up)', 'DESCRIPTION:Demo only. Synthetic data.', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'jissr-visit.ics'; a.click();
}

/* ---------- demo bar ---------- */
const who = document.getElementById('who');
who.innerHTML = state.cases.map((c) => `<option value="${c.id}">${esc(c.patient.name)} · ${c.value}%</option>`).join('');
who.onchange = () => { id = who.value; level = 'normal'; msg = {}; view = 'home'; stopSpeak(); ensureNotified(); render(); };
document.getElementById('reset').onclick = () => { state = resetState(); aiBox = {}; msg = {}; level = 'normal'; view = 'home'; ensureNotified(); render(); };
if (!state.cases.some((c) => c.id === id)) id = state.cases[0].id;
who.value = id;
ensureNotified();
render();
</script>
</body>
</html>
