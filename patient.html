<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jissr">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Jissr: your result</title>
<link rel="stylesheet" href="styles.css">
<style>
body{font-size:16px}
.wrap{max-width:540px;padding-bottom:120px}
.view{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none}
[dir=rtl] .back .ico{transform:scaleX(-1)}
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.bar h1{margin:0;font-size:1.3rem;flex:1}
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 6px}
.greet .hi{color:var(--muted);font-size:14px}
.greet .nm{font-size:1.55rem;font-weight:600;line-height:1.2}
.me{width:50px;height:50px;border-radius:50%;background:var(--p-yellow);color:#b47a10;display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;box-shadow:var(--shadow);flex:none;border:0;cursor:pointer;position:relative}
.me:after{content:"";position:absolute;bottom:2px;inset-inline-end:2px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid var(--card)}
/* journey */
.journey{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 14px 10px;margin:14px 0}
.journey .jh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px}
.journey .jh b{color:var(--ink);font-weight:600}
.track{display:flex}
.trk{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--muted)}
.trk .dot{width:24px;height:24px;border-radius:50%;margin:0 auto 6px;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;z-index:1}
.trk:not(:last-child):after{content:"";position:absolute;top:10.5px;inset-inline-start:50%;width:100%;height:3px;border-radius:2px;background:var(--card2)}
.trk.done .dot{background:var(--brand);color:#fff}
.trk.done:not(:last-child):after{background:var(--brand)}
.trk.now .dot{background:var(--accent);color:#1e2a44;box-shadow:0 0 0 5px var(--accent-l)}
.trk.now{color:var(--ink);font-weight:600}
/* the blue "next step" card */
.next{position:relative;overflow:hidden;background:linear-gradient(135deg,#2c5294,#1a3463);color:#fff;border-radius:24px;padding:22px 20px;margin:14px 0;box-shadow:0 14px 30px rgba(26,52,99,.28)}
.next:before,.next:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.next:before{width:210px;height:210px;top:-90px;inset-inline-end:-70px}
.next:after{width:120px;height:120px;bottom:-60px;inset-inline-start:-30px}
.next>*{position:relative;z-index:1}
.next.ok{background:linear-gradient(135deg,#2fa774,#1f7f57);box-shadow:0 14px 30px rgba(31,127,87,.25)}
.next .badge{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.next h2{font-size:1.3rem;margin:0 0 6px;color:#fff}
.next p{margin:0 0 16px;opacity:.92;font-size:14.5px}
.next .btn{background:#fff;color:#1d3a6b;width:100%;box-shadow:none}
.next.ok .btn{color:#1f7f57}
.next .lbl{color:#fff;opacity:.85}
.appt{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.datebox{background:#fff;color:#1d3a6b;border-radius:16px;width:64px;padding:8px 0;text-align:center;flex:none}
.datebox b{display:block;font-size:1.55rem;line-height:1.1}
.datebox span{font-size:12px;font-weight:600}
.next.ok .datebox{color:#1f7f57}
.appt h2{margin:0}
.appt .sub{opacity:.9;font-size:14px}
/* quick help tiles */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 12px}
.sec h3{margin:0}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.svc button{background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.svc .box{width:100%;max-width:68px;aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.svc button:active .box{transform:scale(.93)}
.b-blue{background:var(--p-blue);color:#1d3a6b}.b-sand{background:#f1e6d2;color:#9a6a1c}.b-yellow{background:var(--p-yellow);color:#c58a10}.b-pink{background:var(--p-pink);color:#d4527a}.b-lilac{background:var(--p-lilac);color:#7a5cd6}.b-mint{background:var(--p-mint);color:#22895e}
/* care contact */
.who{display:flex;gap:14px;align-items:center}
.avatar{width:50px;height:50px;border-radius:16px;background:var(--p-lilac);color:#7a5cd6;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.who .info{flex:1;min-width:0}
.who .info b{display:block}
.call{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(29,58,107,.3);flex:none}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:10px}
/* result screen */
.report{background:var(--p-blue);border-radius:24px;padding:18px 16px 16px;margin:4px 0 12px}
.report .lbl{color:#1d3a6b;font-weight:600}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{border-radius:20px;padding:14px}
.mini small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:6px}
.mini b{display:block;font-size:1rem;margin-top:2px;color:var(--ink)}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:280px;height:auto}
.gauge .gv{font-weight:700;font-size:32px;fill:#1e2a44;font-family:"Poppins",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
/* booking: date strip */
.dates{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dt{flex:none;width:78px;scroll-snap-align:start;border:0;background:var(--card2);border-radius:18px;padding:10px 0 12px;font:inherit;color:var(--ink);cursor:pointer;text-align:center;transition:background .15s,color .15s}
.dt b{display:block;font-size:1.4rem;line-height:1.15}
.dt span{display:block;font-size:12px;color:var(--muted)}
.dt em{display:block;font-style:normal;font-size:12.5px;font-weight:600;margin-top:6px;color:var(--brand)}
.dt[aria-pressed=true]{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(29,58,107,.3)}
.dt[aria-pressed=true] span,.dt[aria-pressed=true] em{color:#fff}
/* confidence */
.scale{display:flex;gap:8px}
.scale button{flex:1;font:inherit;font-weight:600;font-size:1rem;padding:11px 0;border:0;border-radius:14px;background:var(--card2);color:var(--ink);cursor:pointer;min-height:48px}
.scale button[aria-pressed=true]{background:var(--brand);color:#fff}
.tick{width:80px;height:80px;border-radius:50%;background:var(--green);margin:14px auto;display:flex;align-items:center;justify-content:center;color:#fff;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 10px var(--green-l)}
.tick svg{width:42px;height:42px;stroke-width:2.4;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s ease forwards}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.center{text-align:center}
.bigbtn{width:100%;font-size:1.02rem;min-height:54px}
.bubble{background:var(--green-l);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;margin:8px 0;max-width:92%}
[dir=rtl] .bubble{border-radius:18px 18px 4px 18px}
/* tab bar */
.tabs{position:absolute;inset-inline:0;bottom:0;background:var(--card);box-shadow:0 -6px 24px rgba(30,42,68,.07);z-index:20;padding-bottom:env(safe-area-inset-bottom);border-radius:22px 22px 0 0}
.tabs div{max-width:540px;margin:0 auto;display:flex;padding:6px 8px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11.5px;color:var(--muted);padding:4px 0;min-height:56px;cursor:pointer}
.tab .ico{padding:5px 16px;border-radius:12px;box-sizing:content-box;transition:background .15s}
.tab[aria-current=page]{color:var(--brand);font-weight:600}
.tab[aria-current=page] .ico{background:var(--brand-l)}
/* welcome screen */
.splash{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#2c5294,#1a3463);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:splash .5s 1.2s ease forwards}
.splash .name{font-weight:700;font-size:2.2rem;margin-top:14px}
.splash .name span{font-family:"Plex",sans-serif;font-weight:600;opacity:.85;margin-inline-start:10px}
.splash p{opacity:.9;max-width:22ch;margin-top:8px}
@keyframes splash{to{opacity:0;visibility:hidden}}
/* ---------- app shell ---------- */
html,body{height:100%}
body{margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,.tab{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.device{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top)}
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 0 10px}
button:active:not([disabled]){transform:scale(.97)}
.demo{position:relative;z-index:60}
@media (max-width:699px){
  .demo{display:none}
  .demo.open{display:flex;position:fixed;top:0;left:0;right:0}
}
@media (min-width:700px){
  body{background:radial-gradient(circle at 30% 0%,#f3ebdd,#e5d9c4);display:flex;flex-direction:column;align-items:center;min-height:100vh}
  .demo{width:100%}
  .device{position:relative;inset:auto;width:392px;height:min(860px,calc(100vh - 96px));margin:20px auto;border-radius:50px;border:11px solid #1e2a44;box-shadow:0 34px 70px rgba(30,42,68,.28),0 0 0 2px #3a4664}
  .device:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:92px;height:24px;border-radius:14px;background:#1e2a44;z-index:80}
  .screen{padding-top:26px}
  .installcard{display:none!important}
}
.installcard{display:flex;gap:12px;align-items:center}
.installcard .ico{color:var(--brand)}
</style>
</head>

  <div class="screen" id="screen"><div class="wrap" id="app" aria-live="polite"></div></div>

</div>

/* ---------- state ---------- */
let state = loadState();
const params = new URLSearchParams(location.search);
let id = params.get('p') || 'C-001';
const phoneLang = (navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : 'en';
let lang = params.get('lang') || (() => { try { return localStorage.getItem('jissr.lang') || phoneLang; } catch { return phoneLang; } })();
let view = 'home';       // home | result | book | nurse | family
let level = 'normal';
let speaking = false;
let msg = {};            // small, temporary screen state
let aiBox = {};          // AI or template text already shown, by key
const patientActor = () => ({ type: 'patient', name: 'Patient (in app)' });
const sysActor = { type: 'system', name: 'Jissr system' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = () => state.cases.find((c) => c.id === id) || state.cases[0];
const save = () => saveState(state);
const T = () => S[lang];
const loc = () => (lang === 'ar' ? 'ar-AE' : 'en-GB');
const fmtDay = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const staffOf = (sid) => state.staff.find((s) => s.id === sid);
const stageIdx = (c) => ['result', 'notified', 'understood', 'booked', 'attended', 'confirmed', 'referred', 'care_plan', 'closed'].indexOf(c.stage);

// Opening the app counts as "patient notified" in this demo.
function ensureNotified() {
  const c = cur();
  if (c.stage === 'result') { advance(state, c.id, 'notified', sysActor, 'Opened the result in the patient app (demo)'); save(); }
}

/* ---------- the explanation text: pre-written first, AI wording swapped in if it arrives ---------- */
function explainNow(c) {
  const key = `${c.id}|${lang}|${level}|explain`;
  if (aiBox[key]) return aiBox[key];
  const t = { text: explanation({ band: c.band, value: c.value, lang, level }), source: 'template' };
  aiBox[key] = t;
  aiText({ band: c.band, value: c.value, lang, level }).then((r) => {
    if (r.source === 'ai') { aiBox[key] = r; recordAiText(state, c.id, r.text, 'ai'); save(); render(); }
  });
  recordAiText(state, c.id, t.text, 'template'); save();
  return t;
}
function barrierNow(c) {
  const key = `${c.id}|${lang}|${c.barrier}|barrier`;
  if (aiBox[key]) return aiBox[key];
  const t = { text: barrierText(c.barrier, lang), source: 'template' };
  aiBox[key] = t;
  if (c.barrier !== 'none') aiText({ task: 'barrier', band: c.band, value: c.value, lang, barrier: c.barrier }).then((r) => {
    if (r.source === 'ai') { aiBox[key] = r; render(); }
  });
  return t;
}

/* ---------- pieces ---------- */
const tickHtml = () => `<div class="tick" aria-hidden="true">${ic('check', 44)}</div>`;
const initials = (n) => n.replace(/\((.*?)\)/g, '').split(/\s+/).filter((w) => !/^(Nurse|Dr)$/i.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const topBar = () => `<div class="top"><div class="brand">${wordmark()}</div>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
    <button data-lang="ar" aria-pressed="${lang === 'ar'}">عربي</button>
  </div></div>`;
const pageBar = (title) => `<div class="bar"><button class="back" data-go="home" aria-label="${T().back}">${ic('back', 20)}</button><h1>${title}</h1></div>`;
const dparts = (day) => { const d = new Date(day + 'T00:00:00Z'), o = { timeZone: 'UTC' };
  return { num: d.toLocaleDateString(loc(), { ...o, day: 'numeric' }), wd: d.toLocaleDateString(loc(), { ...o, weekday: 'short' }), mon: d.toLocaleDateString(loc(), { ...o, month: 'short' }), month: d.toLocaleDateString(loc(), { ...o, month: 'long' }) }; };
const apptHtml = (c) => { const p = dparts(c.slot.day), t = T();
  return `<div class="appt"><div class="datebox"><b>${p.num}</b><span>${p.wd}</span></div><div><h2>${c.slot.time}</h2><div class="sub">${p.month} · ${t.clinic}</div></div></div>`; };

// where the patient is on the journey (0..4), or 5 when everything is done
function journeyStep(c) {
  switch (c.stage) {
    case 'closed': return 5;
    case 'result': case 'notified': return 0;
    case 'understood': return 1;
    case 'booked': return 2;
    case 'attended': case 'confirmed': case 'referred': return 3;
    default: return 4; // care_plan
  }
}
function trackerHtml(c) {
  const now = journeyStep(c), t = T();
  return `<div class="journey"><div class="jh"><span>${t.journey}</span><b>${now >= 5 ? t.allDone : t.stepOf(now + 1)}</b></div>
    <div class="track" role="list" aria-label="${t.journey}">${t.steps.map((l, i) => {
    const cls = i < now ? 'done' : i === now ? 'now' : '';
    return `<div class="trk ${cls}" role="listitem"><div class="dot">${i < now ? ic('check', 13) : i + 1}</div>${l}</div>`;
  }).join('')}</div></div>`;
}

// the one big card: what happens next, in one sentence, with one button
function nextCard(c) {
  const t = T(), n = t.n;
  if (c.stage === 'booked' && c.slot) {
    return `<section class="next ok"><div class="lbl">${t.upcoming}</div>${apptHtml(c)}<p>${esc(n.booked('')[2])}</p>
      <button class="btn" id="next-go" data-a="ics">${ic('calendar', 18)} ${t.cal}</button></section>`;
  }
  const r = c.referral;
  let d, action = 'nurse', cls = 'wait';
  switch (c.stage) {
    case 'result': case 'notified': d = n.read; action = 'result'; cls = ''; break;
    case 'understood': d = n.book; action = 'book'; cls = ''; break;
    case 'booked': d = n.booked('…'); action = 'none'; cls = 'ok'; break;
    case 'attended': d = n.attended; break;
    case 'confirmed': d = n.confirmed; break;
    case 'referred': {
      const owner = staffOf(c.owner);
      if (!r) d = n.confirmed;
      else if (r.status === 'sent') d = n.sent(r.to);
      else if (r.status === 'accepted') d = n.accepted(r.to, owner ? owner.name : '');
      else if (r.status === 'rejected') d = n.rejected;
      else d = n.completed;
      break;
    }
    case 'care_plan': d = c.plan && c.plan.kind === 'surveillance' ? n.surv : n.treat; break;
    default: d = n.done; action = 'none'; cls = 'ok';
  }
  const [icon, title, sub, btn] = d;
  return `<section class="next ${cls}"><div class="badge">${ic(icon, 24)}</div><h2>${esc(title)}</h2><p>${esc(sub)}</p>
    ${btn && action !== 'none' ? `<button class="btn" id="next-go" data-a="${action}">${btn}</button>` : ''}</section>`;
}

function contactCard(c) {
  const t = T(), o = staffOf(c.owner);
  return `<section class="card"><div class="lbl">${t.careBy}</div>
    ${o ? `<div class="who"><div class="avatar" aria-hidden="true">${esc(initials(o.name))}</div>
      <div class="info"><b>${esc(o.name)}</b><span class="tiny muted">${t.role[o.role]} · ${esc(o.org)}</span></div>
      <button class="call" data-go="nurse" aria-label="${t.qNurse}">${ic('phone', 20)}</button></div>`
      : `<p style="margin:0">${t.noOwner}</p>`}
  </section>`;
}

/* ---------- the gauge: where the result sits (a picture, not a diagnosis) ---------- */
function gaugeHtml(c) {
  const t = T(), MIN = 4, MAX = 12, cx = 120, cy = 112, r = 88;
  const pt = (v, rad) => { const a = Math.PI * (1 - (Math.min(MAX, Math.max(MIN, v)) - MIN) / (MAX - MIN)); return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)]; };
  const arc = (a, b) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const zones = [[4, 5.7, '#22a06b'], [5.7, 6.5, '#f5b544'], [6.5, 10, '#f08a3c'], [10, 12, '#d9473f']];
  const [mx, my] = pt(c.value, r);
  const zi = c.value < 5.7 ? 0 : c.value < 6.5 ? 1 : c.value < 10 ? 2 : 3;
  return `<div class="gauge" role="img" aria-label="HbA1c ${c.value}%: ${t.zones[zi]}">
    <svg viewBox="0 0 240 132" aria-hidden="true">
      ${zones.map(([a, b, col]) => `<path d="${arc(a + 0.03, b - 0.03)}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="butt" opacity="${zones.findIndex((z) => z[0] === a) === zi ? 1 : 0.28}"/>`).join('')}
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="#fff" stroke="#1e2a44" stroke-width="3.5"/>
      <text class="gv" x="${cx}" y="${cy - 10}" text-anchor="middle">${c.value}%</text>
    </svg>
    <div class="legend">${zones.map(([, , col], i) => `<span><i style="background:${col}"></i>${t.zones[i]}</span>`).join('')}</div>
  </div>`;
}

/* ---------- views ---------- */
function installCard() {
  if (isStandalone()) return '';
  const t = T();
  if (canPrompt()) return `<section class="card installcard">${ic('phone', 26)}<div style="flex:1"><b>${t.inst}</b><div class="tiny muted">${t.instSub}</div></div><button class="btn small" id="install-go">${t.instBtn}</button></section>`;
  if (isIOS()) return `<section class="card installcard">${ic('phone', 26)}<div><b>${t.inst}</b><div class="tiny muted">${t.instIos}</div></div></section>`;
  return '';
}

function homeView(c) {
  const t = T();
  const first = c.patient.name.split(' ')[0];
  const canBook = stageIdx(c) >= 2;
  const tiles = [['result', 'speaker', 'b-blue', t.tListen], ['nurse', 'phone', 'b-sand', t.tNurse], ['family', 'users', 'b-pink', t.tFamily], [canBook ? 'book' : 'result', 'calendar', 'b-lilac', t.tBook]];
  let h = `${topBar()}<div class="view">
    <div class="greet"><div><div class="hi">${t.hi}</div><div class="nm">${esc(first)}</div></div><button class="me" id="me-btn" aria-label="Demo: switch patient" title="Demo: switch patient">${esc(initials(c.patient.name))}</button></div>
    ${nextCard(c)}
    ${trackerHtml(c)}
    <div class="sec"><h3>${t.quick}</h3></div>
    <div class="svc">${tiles.map(([g, i, cl, l]) => `<button data-go="${g}"><span class="box ${cl}">${ic(i, 26)}</span>${l}</button>`).join('')}</div>
    ${contactCard(c)}`;
  h += installCard();
  if (stageIdx(c) >= 3 && c.stage !== 'closed') {
    h += `<section class="card"><h3>${t.confQ}</h3><div class="scale">${[1, 2, 3, 4, 5].map((n) => `<button data-conf="${n}" aria-label="${n}" aria-pressed="${!!c.confidence && c.confidence.score === n}">${n}</button>`).join('')}</div>
      <div class="row tiny muted" style="justify-content:space-between;margin-top:6px"><span>${t.confLow}</span><span>${t.confHigh}</span></div>
      ${msg.confDone ? `<div class="ok-msg" style="margin-bottom:0">${t.confThanks}</div>` : ''}</section>`;
  }
  h += `<p class="foot"><a href="staff.html?c=${esc(c.id)}">${t.seeStaff}</a><br>Synthetic demo · not medical advice</p></div>`;
  return h;
}

function resultView(c) {
  const t = T();
  const ex = explainNow(c);
  const cls = classify(c.value);
  const understood = stageIdx(c) >= 2;
  const nextTxt = stageIdx(c) >= 3 ? t.nextBooked : t.nextBook;
  return `${topBar()}<div class="view">${pageBar(t.tabs[1])}
    <div class="report"><div class="lbl">${t.yourTest}</div>${gaugeHtml(c)}
      <div class="center" style="margin-top:10px"><span class="chip ${cls.urgency}">${t.band[cls.band]}</span></div></div>
    <div class="minis">
      <div class="mini" style="background:var(--p-pink)"><span style="color:#d4527a">${ic('calendar', 22)}</span><small>${t.checkBy}</small><b>${c.due ? fmtDay(c.due) : '–'}</b></div>
      <div class="mini" style="background:var(--p-yellow)"><span style="color:#c58a10">${ic('doctor', 22)}</span><small>${t.nextLbl}</small><b>${nextTxt}</b></div>
    </div>
    <section class="card"><h3>${t.whatMeans}</h3>

      <div class="row">
        ${'speechSynthesis' in window ? `<button class="btn ghost small" id="listen">${speaking ? ic('stop', 16) + ' ' + t.stop : ic('speaker', 16) + ' ' + t.listen}</button>` : ''}

        : `<div class="row" style="justify-content:center"><button class="btn bigbtn" id="yes">${t.yes}</button><button class="btn ghost bigbtn" id="no">${t.no}</button></div>`}
    </section></div>`;
}

      ${fh && fh.consent
        ? `<div class="ok-msg">${esc(t.famDone(fh.name))}</div>
           <div class="card soft"><div class="tiny muted">${t.famPreview}</div><p style="margin-bottom:0">${t.famMsg}</p></div>
           <button class="btn ghost" id="fam-off">${t.famOff}</button>`
        : `<label for="fn">${t.famName}</label><input id="fn" maxlength="40" value="${esc(msg.fn || '')}"><label for="fr">${t.famRel}</label><input id="fr" maxlength="30" value="${esc(msg.fr || '')}">
           <p><button class="btn bigbtn" id="fam-on">${t.famOn}</button></p>`}
    </section></div>`;
}

function render() {
  const c = cur();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = 'Jissr · ' + (lang === 'ar' ? 'نتيجتك' : 'your result');
  const v = { home: homeView, result: resultView, book: bookView, nurse: nurseView, family: familyView }[view] || homeView;
  document.getElementById('app').innerHTML = v(c);
  // bottom tab bar (always visible, like a real phone app)
  const tabsDef = [['home', 'home'], ['result', 'result'], ['nurse', 'phone'], ['family', 'users']];
  const activeTab = view === 'book' ? 'home' : view;
  const nav = document.getElementById('tabs');
  nav.innerHTML = '<div>' + tabsDef.map(([v2, icon], i) => `<button class="tab" data-go="${v2}" ${activeTab === v2 ? 'aria-current="page"' : ''}>${ic(icon, 22)}${T().tabs[i]}</button>`).join('') + '</div>';
  wire(c);
}

function act(fn) { try { fn(); save(); } catch (e) { alert(e.message); } render(); }
const go = (v) => { view = v; msg = { ...msg, no: false }; stopSpeak(); render(); document.getElementById('screen').scrollTo({ top: 0 }); };

function wire(c) {
  const $ = (s) => document.querySelector(s);
  document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('jissr.lang', lang); } catch { } stopSpeak(); render(); });
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));
  $('#me-btn') && ($('#me-btn').onclick = () => window.toggleDemo());
  $('#install-go') && ($('#install-go').onclick = async () => { await promptInstall(); render(); });
  $('#next-go') && ($('#next-go').onclick = () => { const a = $('#next-go').dataset.a; a === 'ics' ? downloadIcs() : go(a); });
  $('#listen') && ($('#listen').onclick = () => { speaking ? stopSpeak() : speak(explainNow(c).text); render(); });
  $('#simpler') && ($('#simpler').onclick = () => { level = 'simple'; render(); });
  $('#yes') && ($('#yes').onclick = () => act(() => { if (stageIdx(c) < 2) advance(state, c.id, 'understood', patientActor(), 'Patient confirmed they understood'); msg.no = false; }));
  $('#no') && ($('#no').onclick = () => { level = 'simple'; msg.no = true; act(() => { if (c.barrier === 'none') setBarrier(state, c.id, 'dont_understand', patientActor()); }); });
  document.querySelectorAll('[data-b]').forEach((b) => b.onclick = () => act(() => setBarrier(state, c.id, b.dataset.b, patientActor())));
  document.querySelectorAll('[data-slot]').forEach((b) => b.onclick = () => { msg.slot = +b.dataset.slot; render(); });
  $('#confirm') && ($('#confirm').onclick = () => {
    const s = slotsFor({ band: c.band, barrier: c.barrier }, state.today)[msg.slot];
    act(() => { advance(state, c.id, 'booked', patientActor(), `Booked ${s.day} ${s.time}`); c.slot = s; c.reminder = { when: '1 day before', at: new Date().toISOString() }; msg.slot = null; });
  });
  $('#rem') && ($('#rem').onchange = (e) => act(() => { c.reminder = e.target.checked ? { when: '1 day before', at: new Date().toISOString() } : null; }));
  $('#ics') && ($('#ics').onclick = downloadIcs);
  document.querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => { msg.nn = $('#nn') ? $('#nn').value : msg.nn; act(() => setChannel(state, c.id, b.dataset.ch, patientActor())); });
  $('#nurse-go') && ($('#nurse-go').onclick = () => act(() => requestNurse(state, c.id, patientActor(), `Preferred time: ${$('#nw').value}. ${$('#nn').value.trim()}`.trim())));
  document.querySelectorAll('[data-conf]').forEach((b) => b.onclick = () => { msg.confDone = true; act(() => recordConfidence(state, c.id, +b.dataset.conf, patientActor())); });
  $('#fam-on') && ($('#fam-on').onclick = () => {
    const n = $('#fn').value.trim();
    if (!n) { $('#fn').focus(); return; }
    act(() => { c.familyHelper = { name: n, relation: $('#fr').value.trim(), consent: true, at: new Date().toISOString() }; c.events.push({ type: 'family', at: new Date().toISOString(), by: 'Patient (in app)', role: 'patient', note: `Allowed ${n} to see appointment status (not the result)` }); msg.fn = msg.fr = ''; });
  });
  $('#fam-off') && ($('#fam-off').onclick = () => act(() => { c.familyHelper = null; c.events.push({ type: 'family', at: new Date().toISOString(), by: 'Patient (in app)', role: 'patient', note: 'Stopped sharing with family helper' }); }));
}

/* ---------- read aloud (your browser's built-in voice) ---------- */
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ar' ? 'ar-SA' : 'en-GB'; u.rate = 0.9;
    u.onend = u.onerror = () => { speaking = false; render(); };
    speaking = true; speechSynthesis.speak(u);
  } catch { speaking = false; }
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch { } speaking = false; }

/* ---------- calendar file ---------- */
function downloadIcs() {
  const c = cur(); if (!c.slot) return;
  const d = c.slot.day.replace(/-/g, ''), tm = c.slot.time.replace(':', '') + '00';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Jissr demo//EN', 'BEGIN:VEVENT', `UID:${c.id}-${d}@jissr-demo`, `DTSTAMP:${d}T000000Z`,
    `DTSTART;TZID=Asia/Dubai:${d}T${tm}`, 'DURATION:PT20M', 'SUMMARY:Jissr demo visit (HbA1c follow-up)', 'DESCRIPTION:Demo only. Synthetic data.', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'jissr-visit.ics'; a.click();
}

/* ---------- demo bar ---------- */
const who = document.getElementById('who');
who.innerHTML = state.cases.map((c) => `<option value="${c.id}">${esc(c.patient.name)} · ${c.value}%</option>`).join('');
who.onchange = () => { demoBar.classList.remove('open'); id = who.value; level = 'normal'; msg = {}; view = 'home'; stopSpeak(); ensureNotified(); render(); };
document.getElementById('reset').onclick = () => { state = resetState(); aiBox = {}; msg = {}; level = 'normal'; view = 'home'; ensureNotified(); render(); };
if (!state.cases.some((c) => c.id === id)) id = state.cases[0].id;
who.value = id;
const demoBar = document.getElementById('demo');
window.toggleDemo = () => demoBar.classList.toggle('open');
demoBar.addEventListener('click', (e) => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return; });
registerSW();
onInstallReady(() => { if (view === 'home') render(); });
ensureNotified();
render();

/* ---------- a short welcome screen, once per visit ---------- */
try {
  if (!sessionStorage.getItem('jissr.splash') && !params.has('nosplash')) {
    sessionStorage.setItem('jissr.splash', '1');
    const sp = document.createElement('div');
    sp.className = 'splash'; sp.setAttribute('aria-hidden', 'true');
    sp.innerHTML = `${logo(64)}<div class="name">Jissr<span>جسر</span></div><p>${T().tag.replace('\n', '<br>')}</p>`;
    document.getElementById('device').appendChild(sp);
    setTimeout(() => sp.remove(), 2000);
  }
} catch { /* the app works without the welcome screen */ }
</script>
</body>
</html>
