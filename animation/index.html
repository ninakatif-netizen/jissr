<link rel="stylesheet" href="../styles.css">
<style>
:root{
  --ink:#2b2a33; --muted:#6b6a75; --teal:#1d3a6b; --teal-d:#122950; --sand:#f4e4cf;
  --red:#c0392b; --card:#ffffff; --bg:#15141a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:"Readex","Segoe UI",Tahoma,system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0}
.stage{position:relative;width:min(100vw,calc((100vh - 90px)*16/9));aspect-ratio:16/9;background:#000;overflow:hidden;container-type:inline-size;border-radius:6px}
svg{display:block;width:100%;height:100%}
svg text{font-family:"Readex","Segoe UI",Tahoma,system-ui,sans-serif}

/* everything timed starts hidden, then fades in when its time range is active */
[data-t]{opacity:0;transition:opacity .6s ease, transform 1s ease;pointer-events:none}
[data-t].on{opacity:1}
.scene{transition:opacity .7s ease}

/* subtitles */
.subs{position:absolute;left:4%;right:4%;bottom:3.5%;text-align:center;pointer-events:none}
.subs div{display:inline-block;background:rgba(20,20,26,.78);padding:.35em .8em;border-radius:.5em;margin:.12em 0;line-height:1.3}
.subs .en{font-size:1.8cqw;display:block}
.subs .ar{font-size:2.1cqw;display:block;direction:rtl}
.subs.hide-en .en,.subs.hide-ar .ar{display:none}
.subs .en:empty,.subs .ar:empty{display:none}

/* recording mode: ?clean=1 hides the controls and fills the window */
html.clean body{padding:0}html.clean .controls{display:none}html.clean .stage{width:100vw;height:100vh;border-radius:0}
/* start overlay */
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;background:rgba(15,15,20,.72);cursor:pointer;z-index:5;text-align:center}
.start.gone{display:none}
.start .btn{width:9cqw;height:9cqw;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.start .btn:after{content:"";border-left:3cqw solid var(--teal);border-top:2cqw solid transparent;border-bottom:2cqw solid transparent;margin-left:.8cqw}
.start h1{margin:0;font-size:3cqw;font-weight:700}
.start p{margin:0;font-size:1.8cqw;opacity:.85}

/* controls */
.controls{width:min(100vw,calc((100vh - 90px)*16/9));display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.controls button{background:#2a2933;color:#fff;border:1px solid #3a3946;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.controls input[type=range]{flex:1;min-width:120px;accent-color:#f5b544}
.time{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8;min-width:78px}

/* bits of animation */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pulse.on{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ringing.on{animation:ring .35s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.wave.on{animation:wave 1.6s ease-out infinite}
.wave.w2.on{animation-delay:.3s}.wave.w3.on{animation-delay:.6s}
.paper{transition:transform 1.4s ease-in-out, opacity .6s ease}
.paper.on{transform:translate(245px,-70px) scale(.5) rotate(8deg)}
.drawer-front{transition:transform .8s ease, opacity .6s ease}
.drawer-front.on{transform:translateY(28px)}
</style>

/* ---------- Fatima: a simple flat character, drawn once and reused ---------- */
function fatima(mood){
  const calm=mood==="calm";
  return `
  <path d="M-92 270 Q-100 120 -70 78 Q0 50 70 78 Q100 120 92 270Z" fill="#5b3a5e"/>
  <path d="M-80 100 Q0 150 80 100 L92 150 Q0 200 -92 150Z" fill="#1d3a6b"/>
  <ellipse cx="0" cy="-8" rx="82" ry="88" fill="#1d3a6b"/>
  <ellipse cx="0" cy="6" rx="52" ry="60" fill="#e0b08c"/>
  <g fill="none" stroke="#b98c63" stroke-width="2" stroke-linecap="round">
    <path d="M-34 -22 q10 -5 20 0"/><path d="M14 -22 q10 -5 20 0"/><path d="M-30 20 q-6 8 -4 16"/><path d="M30 20 q6 8 4 16"/>
  </g>
  <g fill="none" stroke="#2b2a33" stroke-width="3.5">
    <circle cx="-21" cy="4" r="15"/><circle cx="21" cy="4" r="15"/><path d="M-6 4 h12"/>
  </g>
  <circle cx="-21" cy="4" r="4" fill="#2b2a33"/><circle cx="21" cy="4" r="4" fill="#2b2a33"/>
  ${calm
    ? `<path d="M-14 -24 q14 -8 28 0" stroke="#7a5a43" stroke-width="3" fill="none" transform="translate(0,2)"/><path d="M-16 32 Q0 46 16 32" stroke="#a5503f" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<path d="M-38 -20 l18 -6" stroke="#7a5a43" stroke-width="3.5" stroke-linecap="round"/><path d="M38 -20 l-18 -6" stroke="#7a5a43" stroke-width="3.5" stroke-linecap="round"/><path d="M-14 38 Q0 28 14 38" stroke="#a5503f" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  `;
}
document.querySelectorAll("[data-fatima]").forEach(g=>{g.innerHTML=fatima(g.dataset.fatima)});

/* ---------- timeline: every [data-t] element is on between its start and end ---------- */
const timed=[...document.querySelectorAll("[data-t]")].map(el=>{
  const [a,b]=el.dataset.t.split("-").map(Number); return {el,a,b};
});
const sEn=document.getElementById("sEn"), sAr=document.getElementById("sAr");
const seek=document.getElementById("seek"), timeEl=document.getElementById("time");
let t=0, playing=false, last=performance.now();

function fmt(x){const s=Math.floor(x);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function render(){
  for(const {el,a,b} of timed){ el.classList.toggle("on", t>=a && t<b); }
  const s=SUBS.find(x=>t>=x[0]&&t<x[1]);
  sEn.textContent=s?s[2]:""; sAr.textContent=s?s[3]:"";
  seek.value=t; timeEl.textContent=fmt(t)+" / "+fmt(DUR);
}

/* ---------- soft sound effects (ringtone, tap, message ding) ---------- */
let ac=null, soundOn=true;
function tone(freq,start,len,vol=.08){
  if(!ac||!soundOn)return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.value=freq; o.type="sine"; o.connect(g); g.connect(ac.destination);
  const n=ac.currentTime+start; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(vol,n+.02); g.gain.linearRampToValueAtTime(0,n+len);
  o.start(n); o.stop(n+len+.05);
}
function ring(){[0,.55,1.4,1.95].forEach(d=>{tone(880,d,.22);tone(660,d+.25,.22)})}
const CUES=[[8.5,ring],[13.5,ring],[18.5,ring],[36,()=>tone(520,0,.08)],[42.5,()=>{tone(988,0,.15);tone(1319,.18,.25)}]];

function setT(v){t=Math.max(0,Math.min(DUR,v));render()}
function play(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==="suspended")ac.resume();
  if(t>=DUR)t=0; playing=true; bPlay.textContent="Pause";
}
function pause(){playing=false;bPlay.textContent="Play"}

function loop(now){
  const dt=(now-last)/1000; last=now;
  if(playing){
    const prev=t; t=Math.min(DUR,t+dt);
    for(const [c,f] of CUES){ if(prev<c && t>=c) f(); }
    if(t>=DUR){pause();bPlay.textContent="Replay"}
  }
  render(); requestAnimationFrame(loop);
}

const bPlay=document.getElementById("bPlay"), start=document.getElementById("start");
bPlay.onclick=()=>{playing?pause():play()};
document.getElementById("bRe").onclick=()=>{t=0;play()};
seek.oninput=()=>{setT(parseFloat(seek.value))};
start.onclick=()=>{start.classList.add("gone");play()};
const subs=document.getElementById("subs");
const bSnd=document.getElementById("bSnd"), bEn=document.getElementById("bEn"), bAr=document.getElementById("bAr");
bSnd.onclick=()=>{soundOn=!soundOn;bSnd.setAttribute("aria-pressed",soundOn);bSnd.textContent=soundOn?"Sound on":"Sound off"};
bEn.onclick=()=>{const on=bEn.getAttribute("aria-pressed")!=="true";bEn.setAttribute("aria-pressed",on);subs.classList.toggle("hide-en",!on)};
bAr.onclick=()=>{const on=bAr.getAttribute("aria-pressed")!=="true";bAr.setAttribute("aria-pressed",on);subs.classList.toggle("hide-ar",!on)};

/* a link like ?t=33 jumps to that second (handy for screenshots) */
const q=new URLSearchParams(location.search);
if(q.has("clean"))document.documentElement.classList.add("clean");
bPlay.textContent="Play";
if(q.has("t")){t=parseFloat(q.get("t"))||0;start.classList.add("gone");pause()}
if(q.has("autoplay")){start.classList.add("gone");soundOn=false;play()}
requestAnimationFrame(loop);
</script>
