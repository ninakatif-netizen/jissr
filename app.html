<style>
/* ---------- splash: water runs through the workflow to the palm ---------- */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,var(--water-800),var(--water-900) 70%);color:#f3efe6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(78vw,330px);height:auto}
.sp-box{opacity:.35;transform-box:fill-box;transform-origin:center;animation:spon .35s ease-out forwards}
.sp-box text{font:700 14px -apple-system,system-ui,Arial,sans-serif;fill:#0a1f2e;text-anchor:middle}
.sp-ch{fill:none;stroke:color-mix(in srgb,var(--water-600) 45%,#082a42);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.sp-w{fill:none;stroke:var(--water-400);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:spfill 2s .15s linear forwards}
.sp-shine{fill:none;stroke:#d6f3fc;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round;opacity:0;animation:spshine 1s 2.15s linear infinite}
.sp-palm{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2);opacity:0;animation:sppalm .6s 2.05s cubic-bezier(.3,1.6,.5,1) forwards}
.sp-pool{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:sppool .5s 1.95s ease-out forwards}
.sp-ring{fill:none;stroke:#7fc8ea;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:spring 1.1s 2.1s ease-out forwards}
.sp-word{opacity:0;animation:spword .5s 2.3s ease-out forwards;text-align:center}
.sp-word b{font-size:40px;letter-spacing:.5px}.sp-word b span{font-weight:500;color:#9fb4c2;margin-inline-start:10px;font-size:30px}
.sp-word p{margin:4px 0 0;color:#c9c1b2;font-size:16px}
#sp-go{margin-top:14px;min-height:50px;min-width:200px;border:1px solid rgba(255,255,255,.5);border-radius:var(--r-pill);background:rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;opacity:0;animation:spword .35s forwards}
#sp-go[hidden]{display:none}
#sp-skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;min-height:44px;padding:0 12px;background:none;border:0;color:#c9c1b2;font:inherit;font-size:15px;cursor:pointer}
@keyframes spfill{to{stroke-dashoffset:0}}
@keyframes spon{to{opacity:1}}
@keyframes spshine{from{opacity:.9;stroke-dashoffset:0}to{opacity:.9;stroke-dashoffset:-24}}
@keyframes sppalm{to{transform:scale(1);opacity:1}}
@keyframes sppool{to{transform:scaleX(1)}}
@keyframes spring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}
@keyframes spword{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s !important;animation-delay:0s !important}}

/* ---------- app ---------- */
.lbl2{margin:0;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.big2{margin:0;font-size:19px;line-height:1.4;color:var(--ink);font-weight:600}
.visit{flex-direction:row;align-items:center;gap:14px}
.visit .d{width:52px;height:56px;border-radius:var(--r-ctl);background:var(--brand-l,#e4f2f9);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;flex:none}
.visit .d b{font-size:22px;line-height:1}
.visit .t{flex:1;min-width:0}.visit .t b{display:block;font-size:17px}.visit .t small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.t2{margin:0;font-size:28px}
.callbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-hero);border:0;background:#1a7f52;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(8px + env(safe-area-inset-top))}
.top .brand svg{flex:none}
.linkbtn{min-height:44px;padding:0 6px;border:0;background:none;color:var(--tint);font:inherit;font-size:16px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:var(--r-ctl);padding:3px;gap:3px}
.seg button{min-height:44px;border:0;border-radius:10px;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(10,31,46,.15)}
.idcard{background:#0a1f2e;color:#f3efe6;border-radius:var(--r-hero);padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.idcard .lbl{font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:#c9c1b2;margin:0}
.idcard .hid{font:700 28px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:1px;margin:0}
.idcard .qrbox{background:#fff;border-radius:var(--r-card);padding:8px;line-height:0}
.idcard .qrbox svg{width:220px;height:220px}
.idcard p{margin:0;font-size:15px;line-height:1.45;color:#e7dfcf;max-width:32ch}
.idcard .row{display:flex;gap:10px;width:100%}
.idcard .row button{flex:1;min-height:46px;border-radius:var(--r-ctl);border:1px solid rgba(231,223,207,.35);background:none;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:19px}
.card p{margin:0;font-size:16px;line-height:1.45;color:var(--ink2)}
.card .btns2{display:flex;gap:10px}.card .btns2 > *{flex:1}
.ask{background:linear-gradient(135deg,#0b6fa8,#0a4f78);color:#fff}
.ask p{color:#e3f1f9}.ask h2{color:#fff}
.ask .wide{background:#fff;color:#0a1f2e}.ask .wide.ghost{background:rgba(255,255,255,.16);color:#fff}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:600}
.field input,.field textarea{min-height:50px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:10px 14px}
.field input:focus-visible,.field textarea:focus-visible{outline:3px solid var(--tint);outline-offset:1px}
#fid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.5px}
.err{color:var(--bad);font-size:15px;margin:0;min-height:1.2em}
.hint{font-size:14px;color:var(--muted);margin:0;line-height:1.4}
.pbanner{display:flex;gap:12px;align-items:center}
.pbanner .av{width:52px;height:52px;font-size:18px;background:#0b6fa8}
.pbanner b{display:block;font-size:22px}.pbanner small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.seen{background:var(--ok-l);color:var(--ok-ink);border-radius:var(--r-ctl);padding:10px 14px;font-size:15px;margin:0;line-height:1.4}
.nowcard{border-inline-start:5px solid #1a7f52}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.chat li{display:flex;flex-direction:column;gap:6px;max-width:86%}
.chat li.me{align-self:flex-end;align-items:flex-end}
.chat .b{padding:10px 14px;border-radius:var(--r-card);font-size:16px;line-height:1.45;background:var(--card);color:var(--ink)}
.chat .me .b{background:#0b6fa8;color:#fff}
.chat .acts{display:flex;flex-wrap:wrap;gap:6px}
.chat .acts button,.chat .acts a{min-height:40px;padding:0 14px;border-radius:var(--r-card);border:1.5px solid #0b6fa8;background:none;color:var(--tint);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.chat .src{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-card);border:0;background:var(--line);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.composer{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.composer input{flex:1;min-width:0;min-height:48px;border-radius:var(--r-hero);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:0 16px}
.composer button{min-width:48px;min-height:48px;border-radius:var(--r-hero);border:0;background:#0b6fa8;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:0 16px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
/* call */
.call{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 50% 20%,var(--water-700),var(--water-900) 72%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));gap:14px;overflow-y:auto}
.call .who2{font-size:30px;font-weight:700;margin:8px 0 0}
.call .st{font-size:17px;color:#c9d8e2;margin:0}
.call .orb{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(54,181,232,.12),0 0 0 22px rgba(54,181,232,.06)}
.call.ringing .orb{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(54,181,232,.2),0 0 0 36px rgba(54,181,232,.08)}}
.call .wave{display:flex;gap:5px;height:28px;align-items:center}
.call .wave i{width:5px;height:6px;border-radius:3px;background:var(--water-400)}
.call.speaking .wave i{animation:wv .9s ease-in-out infinite}
.call .wave i:nth-child(2){animation-delay:.1s}.call .wave i:nth-child(3){animation-delay:.2s}.call .wave i:nth-child(4){animation-delay:.3s}.call .wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:26px}}
.call .cap{background:rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-card);padding:14px 16px;font-size:18px;line-height:1.45;max-width:420px;width:100%;min-height:80px;margin:0}
.call .you{font-size:15px;color:#c9d8e2;margin:0}
.call .opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.call .opts button{min-height:52px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.92);color:var(--water-900);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.call .ans{display:flex;gap:56px;margin-top:auto}
.call .ans button,.call .end{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.call .acc{background:#1d7f53}.call .dec,.call .end{background:#c0362c}
.call .ans span,.call .endl{display:block;text-align:center;font-size:14px;margin-top:6px;color:#c9d8e2}
.call .vlabel{font-size:13px;color:#9fb4c2;margin:0;text-align:center}
.call .lang{display:flex;gap:8px}
.call .lang button{min-height:40px;padding:0 14px;border-radius:var(--r-card);border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font:inherit;font-size:15px;cursor:pointer}
.call .lang button[aria-pressed=true]{background:#fff;color:#0a1f2e}
/* scanner */
.scan{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:20px}
.scan video{width:min(90vw,420px);border-radius:var(--r-card)}
.scan button{min-height:48px;padding:0 22px;border-radius:var(--r-hero);border:0;background:#fff;color:#0a1f2e;font:inherit;font-weight:700;cursor:pointer}
</style>

<script type="module">
import { registerSW } from './core/pwa.mjs';
import { loadState, saveState } from './core/store.mjs';
import { qrSvg } from './core/qr.mjs';
import { healthId, findPatient, logAccess, careHistory, careMapHtml, historyHtml, routeOf, FACILITIES, CARE_MAP_CSS, lookupLink, placeName, parseHealthId } from './core/history.mjs';
import { contextOf, reply, documentsOf, callTurn, nextStep } from './core/assistant.mjs';
import { workflowHtml } from './core/workflow.mjs';
import { requestNurse, isoDay } from './core/cases.mjs';
import { resultText } from './core/programmes.mjs';
import { trackHtml, STEPS_CSS } from './core/steps.mjs';
registerSW();

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } } };
const sess = { get: (k) => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } } };
const TODAY = isoDay(Date.now());
const I = {
  doc: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 13h7M9 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  q: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  eye: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  phone: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l3 4-2 2c1 2.5 3.5 5 6 6l2-2 4 3-2 4C10 20 4 14 3 5z" fill="currentColor"/></svg>',
  chat: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="currentColor"/></svg>',
  person: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7z" fill="currentColor"/></svg>',
  steth: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6a5 5 0 0 0 10 0V3M11 14v2a4 4 0 0 0 8 0v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>',
  qr: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  send: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg class="chev" width="9" height="15" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  scan: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M3 12h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};
const row = (id, tile, ic, title, sub, tag = 'button', href = '') => `<li><${tag} class="row" ${tag === 'a' ? `href="${href}"` : ''} id="${id}"><span class="tile ${tile}">${ic}</span><span class="tx"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>${I.chev}</${tag}></li>`;
// the patient's journey in five steps, from the real case
const STG = ['result', 'notified', 'understood', 'booked', 'attended', 'confirmed', 'referred', 'care_plan', 'closed'];
function journey(c) {
  const i = STG.indexOf(c.stage), told = (c.events || []).some((e) => (e.type === 'contact' && e.role !== 'system') || e.type === 'understood');
  const done = [told || i >= 2, i >= 2, i >= 3, i >= 4, i >= 8];
  const now = done.indexOf(false);
  return [['told', 'Told'], ['understood', 'Understood'], ['booked', 'Booked'], ['seen', 'Seen'], ['closed', 'Care']].map(([key, label], k) => ({ key, label, state: done[k] ? 'done' : k === now ? 'now' : 'todo' }));
}

const LANG = { ar: 'Arabic', en: 'English', ur: 'Urdu', hi: 'Hindi', tl: 'Tagalog', bn: 'Bengali', ml: 'Malayalam' };
const first = (c) => c.patient.name.split(' ')[0];
const clean = (n) => n.replace(/\s*\(coordinator\)/, '');
const initials = (n) => clean(n).replace(/^(Dr|Nurse)\s+/, '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('');
const fmtDay = (d, opt = { weekday: 'short', day: 'numeric', month: 'short' }) => new Date(d.slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-GB', { ...opt, timeZone: 'UTC' });
const time = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const logo = '<svg width="30" height="24" viewBox="0 0 34 26" aria-hidden="true"><path d="M2 20c6 0 8-12 15-12s9 12 15 12" fill="none" stroke="#0b6fa8" stroke-width="3" stroke-linecap="round"/><path d="M27 9V3M24 5l3-2 3 2" fill="none" stroke="#1a7f52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let state = loadState();
const save = () => saveState(state);

// ---------- sound: made in the browser (no audio file), soft and short ----------
let ac = null;
const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } return ac; };
function tone(f, at, dur, vol, type = 'sine') {
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function chime() {   // a water drop, then two little bells
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.2);
  tone(1046.5, 0.13, 0.9, 0.2); tone(2093, 0.13, 0.5, 0.04);
  tone(1568, 0.28, 1.1, 0.2); tone(3136, 0.28, 0.5, 0.035);
}
let ringTimer = null;
const ringOnce = () => { tone(988, 0, 0.35, 0.12, 'triangle'); tone(1319, 0.18, 0.45, 0.12, 'triangle'); };
const ringStart = () => { ringStop(); ringOnce(); ringTimer = setInterval(ringOnce, 1600); };
const ringStop = () => { clearInterval(ringTimer); ringTimer = null; };

// ---------- splash ----------
function splash(done) {
  const el = $('#splash'), q = new URLSearchParams(location.search);
  if (q.has('nosplash') || (sess.get('falaj.app.splash') && !q.has('splash'))) { done(); return; }
  sess.set('falaj.app.splash', 1);
  el.hidden = false;
  let closed = false;
  const close = () => { if (closed) return; closed = true; el.classList.add('out'); setTimeout(() => { el.hidden = true; }, 460); done(); };
  const go = $('#sp-go');
  const play = () => { const c = audio(); if (c && c.state === 'suspended') c.resume().then(chime, () => {}); else chime(); };
  go.onclick = () => { play(); setTimeout(close, 650); };
  $('#sp-skip').onclick = close;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => {
    const c = audio();
    if (c && c.state === 'running') { chime(); setTimeout(close, 1400); }
    else go.hidden = false;   // browsers only allow sound after a tap: the first tap plays the chime
  }, reduce ? 300 : 2150);
}

// ---------- actions the assistant can do (patient-side only) ----------
function doAction(c, type) {
  c = caseOf(c.id);
  if (type === 'nurse') {
    if (!(c.nurseRequest && !c.nurseRequest.done)) { requestNurse(state, c.id, { type: 'patient', name: `${c.patient.name} (patient)` }, 'Asked through the Falaj assistant'); save(); }
    toast('A nurse will call you'); return 'A nurse from your care team will call you.';
  }
  if (type === 'reminder') {
    const v = c.slot || c.hold; if (!v) { toast('No visit to remind you about yet'); return ''; }
    c.assist = c.assist || {}; c.assist.reminders = c.assist.reminders || [];
    if (!c.assist.reminders.some((r) => r.day === v.day)) c.assist.reminders.push({ day: v.day, time: v.time, at: new Date().toISOString() });
    save(); toast('Reminder set for the day before'); return 'Reminder set.';
  }
  if (type === 'ics') { ics(c); return ''; }
  if (type === 'book') { location.href = `me.html?p=${c.id}`; return ''; }
  if (type === 'docs') { docsSheet(c); return ''; }
  if (type === 'question') { questionSheet(c); return ''; }
  if (type === 'call') { startCall(c); return ''; }
  return '';
}
function ics(c) {
  const v = c.slot || c.hold; if (!v) { toast('No visit booked yet'); return; }
  const d = v.day.replace(/-/g, ''), t = v.time.replace(':', '') + '00';
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Falaj demo//EN', 'BEGIN:VEVENT', `UID:${c.id}-${d}@falaj.demo`, `DTSTART:${d}T${t}`, 'DURATION:PT30M', 'SUMMARY:Visit with your family doctor (Falaj)', 'LOCATION:Family Clinic A', 'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Visit tomorrow', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = 'falaj-visit.ics'; a.click();
}

const aiLabel = () => 'Organises your care. Never gives results.';

    <div class="dock"><div class="chips" role="group" aria-label="Suggestions">${CHIPS.map((t) => `<button data-chip="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <form class="composer" id="compose"><label class="sr" for="msg" style="position:absolute;left:-9999px">Message</label><input id="msg" autocomplete="off" maxlength="400" placeholder="Message"><button aria-label="Send">${I.send}</button></form></div>`);
  const list = $('#chat');
  const bind = () => list.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => { const said = doAction(c, b.dataset.act); if (said) { msgs.push({ who: 'ai', text: said, actions: [] }); sess.set(key, msgs); list.insertAdjacentHTML('beforeend', bubble(msgs[msgs.length - 1])); } }; });
  const scroll = () => { const last = list.lastElementChild; if (last) last.scrollIntoView({ block: 'end', inline: 'nearest' }); const ch = document.querySelector('.chips'); if (ch) ch.scrollLeft = 0; };
  bind(); scroll();
  async function send(text) {
    text = text.trim(); if (!text) return;
    msgs.push({ who: 'me', text }); list.insertAdjacentHTML('beforeend', bubble(msgs[msgs.length - 1]));
    list.insertAdjacentHTML('beforeend', '<li class="ai" id="typing"><span class="b"><span class="typing" aria-label="Falaj is writing"><i></i><i></i><i></i></span></span></li>'); scroll();

    try {

      if (res.ok) { const j = await res.json(); if (j.ok) r = { text: j.text, actions: j.actions || [], src: j.source }; }
    } catch { /* offline: the rules answer on the phone */ }
    if (!r) { const x = reply(text, ctx); r = { text: x.text, actions: x.actions, src: 'rules' }; }
    await new Promise((ok) => setTimeout(ok, 350));
    $('#typing') && $('#typing').remove();

  }

}

let voiceOn = null, player = null;
fetch('/api/jissr-cartesia').then((r) => (r.ok ? r.json() : {})).then((j) => { voiceOn = !!j.voice; }).catch(() => { voiceOn = false; });
function stopVoice() { try { if (player) { player.pause(); player = null; } speechSynthesis && speechSynthesis.cancel(); } catch { /* none */ } }
function speak(text, lang, onEnd) {
  stopVoice();
  const fallback = () => {
    try {
      if (!('speechSynthesis' in window)) { onEnd(); return; }
      const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ar' ? 'ar-AE' : 'en-GB'; u.rate = 0.95;
      u.onend = onEnd; u.onerror = onEnd; speechSynthesis.speak(u);
    } catch { onEnd(); }
  };
  if (voiceOn) {
    player = new Audio(`/api/jissr-cartesia?lang=${lang}&text=${encodeURIComponent(text)}`);
    player.onended = onEnd; player.onerror = () => { player = null; fallback(); };
    player.play().catch(() => { player = null; fallback(); });
  } else fallback();
}
function startCall(c) {
  closeLayer();
  const call = { lang: 'en', started: 0, timer: null, saved: [] };
  const ctx = () => contextOf(caseOf(c.id));
  const el = (html) => { $('#layer').innerHTML = html; };
  const orb = `<div class="orb" aria-hidden="true"><svg width="64" height="50" viewBox="0 0 34 26"><path d="M2 20c6 0 8-12 15-12s9 12 15 12" fill="none" stroke="#7fc8ea" stroke-width="3" stroke-linecap="round"/><path d="M27 9V3M24 5l3-2 3 2" fill="none" stroke="#9ff0c2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  const vlabel = () => (voiceOn ? 'Natural voice by Cartesia. Captions on.' : 'Phone voice (the Cartesia voice is not set up yet). Captions on.');
  const ringing = () => {
    el(`<div class="call ringing" role="dialog" aria-modal="true" aria-label="Incoming call from Falaj">${orb}<p class="who2">Falaj assistant</p><p class="st">is calling you…</p>
      <div class="lang" role="group" aria-label="Language of the call"><button data-l="en" aria-pressed="${call.lang === 'en'}">English</button><button data-l="ar" aria-pressed="${call.lang === 'ar'}" lang="ar">العربية</button></div>
      <p class="vlabel">${vlabel()}<br>An automated voice from your care team, in this app. It never talks about results.</p>
      <div class="ans"><div><button class="dec" id="dec" aria-label="Decline"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c4-4 12-4 16 0l-2 3-3-1v-2c-2-.6-4-.6-6 0v2l-3 1z" fill="#fff"/></svg></button><span>Decline</span></div>
      <div><button class="acc" id="acc" aria-label="Accept"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l3 4-2 2c1 2.5 3.5 5 6 6l2-2 4 3-2 4C10 20 4 14 3 5z" fill="#fff"/></svg></button><span>Accept</span></div></div></div>`);
    $('#layer [role=dialog]').focus && $('#acc').focus();
    document.querySelectorAll('.call [data-l]').forEach((b) => { b.onclick = () => { call.lang = b.dataset.l; ringing(); }; });
    $('#dec').onclick = () => { ringStop(); closeLayer(); toast('Call declined. You can ask Falaj to call again any time.'); };
    $('#acc').onclick = () => { ringStop(); audio(); call.started = Date.now(); live('hello'); };
  };
  const clock = () => { const s = Math.round((Date.now() - call.started) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const live = (step, you = '') => {
    const t = callTurn(step, ctx(), call.lang);
    if (t.action === 'reminder') { const said = doAction(c, 'reminder'); if (said) call.saved.push('Reminder set'); }
    if (t.action === 'nurse') { doAction(c, 'nurse'); call.saved.push('A nurse will call you'); }
    el(`<div class="call speaking" role="dialog" aria-modal="true" aria-label="Call with the Falaj assistant">${orb}<p class="who2">Falaj assistant</p><p class="st" id="clock">${clock()}</p>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      ${you ? `<p class="you">You: ${esc(you)}</p>` : ''}
      <p class="cap" aria-live="polite" ${call.lang === 'ar' ? 'lang="ar" dir="rtl"' : ''}>${esc(t.say)}</p>
      <div class="opts">${t.options.map((o) => `<button data-o="${o.id}" ${call.lang === 'ar' ? 'lang="ar"' : ''}>${esc(o.label)}</button>`).join('')}</div>
      <p class="vlabel">${vlabel()}</p>
      <div style="margin-top:auto;text-align:center"><button class="end" id="end" aria-label="End call"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c4-4 12-4 16 0l-2 3-3-1v-2c-2-.6-4-.6-6 0v2l-3 1z" fill="#fff"/></svg></button><span class="endl">End</span></div></div>`);
    clearInterval(call.timer); call.timer = setInterval(() => { const k = $('#clock'); if (k) k.textContent = clock(); else clearInterval(call.timer); }, 1000);
    speak(t.say, call.lang, () => { const w = $('.call'); if (w) w.classList.remove('speaking'); if (t.done) setTimeout(ended, 600); });
    document.querySelectorAll('.call [data-o]').forEach((b) => { b.onclick = () => live(b.dataset.o, b.textContent); });
    $('#end').onclick = ended;
  };
  const ended = () => {
    if (!$('.call')) return;
    clearInterval(call.timer); stopVoice();
    el(`<div class="call" role="dialog" aria-modal="true" aria-label="Call ended">${orb}<p class="who2">Call ended</p><p class="st">${clock()}</p>
      <p class="cap">${call.saved.length ? `Saved in your Falaj: ${esc([...new Set(call.saved)].join(', '))}.` : 'Nothing was changed.'}</p>
      <div class="opts"><button id="done">Back to Falaj</button></div></div>`);
    $('#done').onclick = () => { closeLayer(); render(); };
    $('#done').focus();
  };
  ringStart();
  ringing();
}

// ---------- clinician: find a patient by Health ID and name, or scan the QR ----------
function doctorHome(s) {
  const pending = sess.get('falaj.app.pending') || '', recent = (sess.get('falaj.app.open') || []).map(caseOf).filter(Boolean);
  const demo = caseOf('C-040');
  paint(`<div class="nav"><span></span>${signOutBtn}</div>
    <div class="lt"><p class="eyebrow">${esc(clean(s.name))} · ${esc(s.org)}</p><h1>Find a patient</h1></div>
    <form class="form2" id="findf" novalidate style="display:flex;flex-direction:column;gap:14px">
      <ul class="ig"><li><label for="fid">Health ID</label><input id="fid" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(pending)}" placeholder="FLJ-2026-0000" aria-describedby="ferr"></li>
        <li><label for="fname">Name</label><input id="fname" autocomplete="off" spellcheck="false" placeholder="First and family name" aria-describedby="ferr"></li></ul>
      <p class="err" id="ferr" role="alert" style="margin:-4px 16px 0"></p>
      <button class="btn-fill" id="open">Open care map</button>
      ${'BarcodeDetector' in window ? `<button type="button" class="btn-tint" id="scan">${I.scan} Scan QR code</button>` : ''}
    </form>
    ${demo ? `<p class="foot2">Demo: ${esc(healthId(demo))} · ${esc(demo.patient.name)}</p>` : ''}
    ${recent.length ? `<p class="gh2">Opened today</p><ul class="ig">${recent.map((c) => row('r-' + c.id, 'blue', I.person, esc(c.patient.name), esc(healthId(c)), 'a', '#map=' + c.id)).join('')}</ul>` : ''}
    <ul class="ig">${row('wl', 'blue', I.steth, 'My worklist', 'On the care team website', 'a', `team.html?as=${s.id}`)}</ul>
    <p class="foot2">The patient sees every opening.</p>`);
  bindOut();
  if (pending) $('#fname').focus();
  $('#findf').onsubmit = (e) => {
    e.preventDefault();
    const r = findPatient(state, $('#fid').value, $('#fname').value);
    if (r.error) { $('#ferr').textContent = r.message; (r.error === 'id' ? $('#fid') : $('#fname')).focus(); return; }
    const c = r.case; logAccess(c, s); save();
    const open = new Set(sess.get('falaj.app.open') || []); open.add(c.id); sess.set('falaj.app.open', [...open]);
    sess.set('falaj.app.pending', null);
    go('map=' + c.id);
  };
  const sc = $('#scan'); if (sc) sc.onclick = scan;
}
async function scan() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch { toast('The camera is not available'); return; }
  $('#layer').innerHTML = '<div class="scan" role="dialog" aria-modal="true" aria-label="Scan a QR code"><video playsinline muted></video><p>Point the camera at the patient\'s QR code</p><button id="scx">Cancel</button></div>';
  const v = $('#layer video'); v.srcObject = stream; await v.play().catch(() => {});
  const det = new window.BarcodeDetector({ formats: ['qr_code'] });
  let on = true;
  const stop = () => { on = false; stream.getTracks().forEach((t) => t.stop()); $('#layer').innerHTML = ''; };
  $('#scx').onclick = stop;
  const loop = async () => {
    if (!on) return;
    try {
      const codes = await det.detect(v);
      const raw = codes[0] && codes[0].rawValue;
      const m = raw && (raw.match(/#find=([A-Z0-9-]+)/i) || [null, raw]);
      if (m && parseHealthId(m[1])) { stop(); $('#fid').value = m[1].toUpperCase(); $('#fname').focus(); toast('Health ID scanned. Now type the name.'); return; }
    } catch { /* keep trying */ }
    setTimeout(loop, 300);
  };
  loop();
}

// ---------- the care map: every place, the water between them, the palm where care is now ----------
let mapSel = '', mapView = 'history';
function mapScreen(s, c) {
  const hist = careHistory(c, state.staff), route = routeOf(hist), last = route[route.length - 1];
  const places = [...new Set(route)];
  const wf = mapView === 'falaj' ? workflowHtml(c, { staff: state.staff, today: TODAY, resultText: resultText(c) }).html : '';
  paint(`<div class="nav"><a class="back" href="#find">‹ Find</a>${signOutBtn}</div>
    <div class="ptcard"><span class="av" aria-hidden="true">${esc(initials(c.patient.name))}</span><span><b>${esc(c.patient.name)}</b><small>${c.patient.age} · ${esc(LANG[c.patient.language] || c.patient.language)} · ${esc(healthId(c))}</small></span></div>
    ${careMapHtml(hist, { selected: mapSel })}
    <section class="status2" aria-labelledby="cn"><span class="pill" id="cn">Care is now at ${esc(FACILITIES[last].name)}</span><p>${esc(nextStep(contextOf(c)))}</p><a class="btn-tint" href="team.html?as=${s.id}&c=${c.id}">Open in my worklist</a></section>
    <div class="seg" role="group" aria-label="Show"><button data-v="history" aria-pressed="${mapView === 'history'}">History · ${hist.length}</button><button data-v="falaj" aria-pressed="${mapView === 'falaj'}">This result</button></div>
    ${mapView === 'falaj' ? wf : `${mapSel ? `<button class="linkbtn" id="allr" style="align-self:flex-start;padding:0">${esc(FACILITIES[mapSel].name)} only · show all</button>` : ''}<div id="hh">${historyHtml(hist, { only: mapSel })}</div>`}
    <p class="foot2">Invented records and places. ${esc(first(c))} sees that you opened this file.</p>`);
  bindOut();
  document.querySelectorAll('.cm-dot').forEach((b) => { b.onclick = () => { mapSel = mapSel === b.dataset.fac ? '' : b.dataset.fac; mapView = 'history'; mapScreen(s, c); const h = $('#hh'); if (h) h.scrollIntoView({ block: 'start' }); }; });
  document.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => { mapView = b.dataset.v; mapScreen(s, c); }; });
  const all = $('#allr'); if (all) all.onclick = () => { mapSel = ''; mapScreen(s, c); };
}

splash(() => render());
</script>
