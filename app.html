<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jissr · جسر</title>
<meta name="description" content="Jissr: one app for the screening-to-care loop, for patients and for the care team. Synthetic demo.">
<meta name="theme-color" content="#f5eee3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jissr">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app-shell.css">
<style>
.hero{text-align:center;padding:34px 6px 10px}
.hero .mark{color:#14284b;display:inline-flex}
.hero h1{font-size:34px;margin:12px 0 4px}
.hero h1 span{font-family:var(--text);font-weight:500;color:#86602c;margin-inline-start:8px}
.hero p{color:var(--muted);margin:0 auto;max-width:28ch}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-radius:22px;padding:18px;margin:12px 0 0;border:1px solid var(--line);background:var(--card)}
.pick.navy{border:0;background:#14284b;color:#fff}
.pick.navy b{color:#fff}.pick.navy>.ico:last-child{color:#e3c38f}
.pick b{display:block;font-size:18px;font-family:var(--display);font-weight:600}
.pick span.t{flex:1}
.pick small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.pick.navy small{color:#d3d9e6}
.pick>.ico:last-child{color:#a8977a;flex:none}
.roles2{margin-top:6px}
.roles2 .pick{padding:14px 16px;border-radius:18px;margin-top:8px}
.roles2 .pick b{font-size:16px}
.cont{display:block;text-align:center;margin:16px 0 0;font-weight:600}
.foot2{text-align:center;font-size:12.5px;color:var(--muted);margin:22px 0 0}
</style>
</head>
<body>
<div class="demo" style="justify-content:space-between;padding:8px 16px;font-size:13px"><span>Demo · synthetic data only · not medical advice</span><a href="index.html">About the project</a></div>
<div class="device">
  <div class="screen"><div class="wrap" id="app"></div></div>
</div>
<script type="module">
import { registerSW } from './core/pwa.mjs';
import { ic, logo } from './core/ui.mjs';
import { CARE_ROLES, roleView } from './core/roles.mjs';
registerSW();
const app = document.getElementById('app');
let showRoles = new URLSearchParams(location.search).has('care');
let last = null; try { last = localStorage.getItem('jissr.lastApp'); } catch { }
function render() {
  const lastRole = last && last.startsWith('care:') ? roleView(last.slice(5)) : null;
  app.innerHTML = `<div class="view">
    <div class="hero"><span class="mark">${logo(64)}</span><h1>Jissr<span>جسر</span></h1><p>From a screening result to the right care. Nobody left behind.</p></div>
    ${!showRoles ? `
      <p class="sec" style="text-align:center;margin-top:22px">Who are you? · من أنت؟</p>
      <button class="pick navy" data-go="patient.html?p=C-001"><span class="gtile">${ic('home', 24)}</span><span class="t"><b>I am a patient</b><small>Understand my result, book, talk to a nurse. English and العربية.</small></span>${ic('next', 20)}</button>
      <button class="pick" id="care"><span class="gtile">${ic('doctor', 24)}</span><span class="t"><b>I work in care</b><small>Nurse, family doctor, hospital specialist, clinical lead.</small></span>${ic('next', 20)}</button>
      ${lastRole ? `<a class="cont" href="care.html?role=${lastRole.id}">Continue as ${lastRole.title} →</a>` : last === 'patient' ? `<a class="cont" href="patient.html">Continue as patient →</a>` : ''}`
    : `
      <div class="bar2"><button class="backbtn" id="back" aria-label="Back">${ic('back', 20)}</button><h1>Your role</h1></div>
      <p class="sub2">Each role sees its own part of the same case.</p>
      <div class="roles2">${CARE_ROLES.map((id) => roleView(id)).map((r) => `<button class="pick" data-go="care.html?role=${r.id}" data-role="${r.id}"><span class="gtile">${ic(r.icon, 22)}</span><span class="t"><b>${r.title}</b><small>${r.org} · ${r.part}</small></span>${ic('next', 18)}</button>`).join('')}</div>
      <p class="foot2">Lab and programme manager views are on the <a href="roles.html">desktop dashboard</a>.<br>Demo: choosing a role is not a login.</p>`}
    ${!showRoles ? `<p class="foot2">Synthetic demo · not medical advice</p>` : ''}
  </div>`;
  app.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
    try { localStorage.setItem('jissr.lastApp', b.dataset.role ? 'care:' + b.dataset.role : 'patient'); } catch { }
    location.href = b.dataset.go;
  });
  const c = document.getElementById('care'); if (c) c.onclick = () => { showRoles = true; render(); };
  const k = document.getElementById('back'); if (k) k.onclick = () => { showRoles = false; render(); };
}
render();
</script>
</body>
</html>
