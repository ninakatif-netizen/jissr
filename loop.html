<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falaj: call, hand over, close</title>
<meta name="description" content="Falaj in three moments: an AI call books the visit, doctors hand over the case, and the loop closes only when the consultation is confirmed. Synthetic data only.">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
/* iOS-native look: the phone's own font, grouped lists, large titles, switches. One idea per screen. */
:root{--fill:#0b6fa8;--fill-go:#1a7f52;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--ink2:#3a3a3c;--muted:#5d5d62;--line:#e5e5ea;--tint:#0b6fa8;--tint-l:#e3eff7;--ok:#1a7f52;--ok-l:#e3f4ec;--ok-ink:#0f5a3a;--bad:#c4271b;--warn-l:#fbefdd;--warn-ink:#7a4a0c;--off:#c4c4c8}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--ink2:#d1d1d6;--muted:#a1a1a8;--line:#38383a;--tint:#4aa8e0;--tint-l:#10293a;--ok:#34a46e;--ok-l:#12301f;--ok-ink:#9be0bd;--bad:#ff5b4f;--warn-l:#3a2c12;--warn-ink:#f2c46e;--off:#48484a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:2;padding:calc(14px + env(safe-area-inset-top)) 20px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--line);padding:5px 10px;border-radius:99px}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.segs li{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.segs li[aria-current=step]{color:var(--ink)}
.track{display:block;height:5px;border-radius:3px;background:var(--off);overflow:hidden}
.fill{display:block;height:100%;border-radius:3px;background:var(--tint);transition:width .7s cubic-bezier(.2,.8,.2,1),background-color .4s}
main{flex:1 1 auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.2px}
h1{margin:2px 0 0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.2px}
.head{padding:0 4px}
.group{display:flex;flex-direction:column;gap:6px}
.gh,.gf{padding:0 16px;font-size:13px;line-height:1.4;color:var(--muted)}
.gh{text-transform:uppercase}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{position:relative;min-height:44px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}
.row+.row::before{content:"";position:absolute;inset-inline-start:16px;inset-inline-end:0;top:0;height:1px;background:var(--line)}
.row .v{color:var(--muted);text-align:end}
.row.sw{padding-block:7px}
.card{background:var(--card);border-radius:14px;padding:14px 16px}
.switch{width:51px;height:31px;flex:none;border:0;border-radius:99px;padding:2px;background:var(--off);cursor:pointer;display:flex;justify-content:flex-start;transition:background-color .2s}
.switch[aria-checked=true]{background:var(--ok);justify-content:flex-end}
.switch span{width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.ringcard{background:var(--card);border-radius:20px;padding:34px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-bottom:10px}
.ringcard .who{font-size:24px;font-weight:600}
.calls{display:flex;gap:64px;margin-top:26px}
.calls div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.round{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.round.red{background:#c4271b}.round.green{background:var(--fill-go)}.round.blue{background:var(--fill);width:76px;height:76px}
.round[aria-disabled=true]{background:var(--off);cursor:not-allowed}
.callhead{display:flex;align-items:center;gap:12px;padding:12px 14px}
.callhead .a{width:40px;height:40px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.callhead b{display:block;font-size:15px}.callhead small{font-size:13px;color:var(--muted)}
.tag{margin-inline-start:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:#c4271b;color:#fff}
.tag.ended{background:var(--line);color:var(--ink2)}
.chat{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.chat li{display:flex}
.b{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.38}
.b.ai{background:var(--card);border-radius:18px 18px 18px 6px}
.b.me{margin-inline-start:auto;background:var(--fill);color:#fff;border-radius:18px 18px 6px 18px}
.b.sys{margin-inline:auto;display:inline-flex;align-items:center;gap:6px;background:var(--warn-l);color:var(--warn-ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
[dir=rtl] .b.ai{border-radius:18px 18px 6px 18px}[dir=rtl] .b.me{border-radius:18px 18px 18px 6px}
.status{display:flex;gap:12px;align-items:flex-start}
.status b{display:block;font-size:17px;margin-bottom:3px}.status span{font-size:15px;line-height:1.4;color:var(--ink2)}
.status.ok{background:var(--ok-l)}.status.ok b{color:var(--ok-ink)}.status.ok span{color:var(--ok-ink)}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--muted)}
.mic.live{color:var(--bad);font-weight:600}
.round.stop{background:#c4271b;width:76px;height:76px}
.round.stop span{width:24px;height:24px;border-radius:5px;background:#fff}
.dict{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.dict.card{padding:14px 16px}
.dict li{font-size:15px;line-height:1.45;color:var(--ink2)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 8px 4px}
.done .palm{width:88px;height:88px;border-radius:50%;background:var(--ok-l);display:grid;place-items:center;margin-bottom:6px}
.done p{margin:0;font-size:17px;line-height:1.4;color:var(--ink2)}
.foot{padding:10px 16px calc(18px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.primary{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--fill);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.primary.go{background:var(--fill-go)}
.light{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--tint-l);color:var(--tint);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.more{text-align:center;font-size:13px;color:var(--muted);padding:6px 0 0}
.more a{color:var(--tint)}
p.note{margin:0;padding:0 16px;font-size:13px;line-height:1.4;color:var(--muted)}
button{-webkit-tap-highlight-color:transparent;transition:opacity .12s,transform .12s}
button:active{opacity:.75;transform:scale(.98)}
button:focus-visible,a:focus-visible{outline:3px solid #36b5e8;outline-offset:2px}
.pop{animation:pop .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(26,127,82,.45)}100%{box-shadow:0 0 0 26px rgba(26,127,82,0)}}
.rec{animation:rec 1.2s ease-out infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 rgba(196,39,27,.4)}100%{box-shadow:0 0 0 22px rgba(196,39,27,0)}}
@media (prefers-reduced-motion:reduce){.pop,.ring,.rec{animation:none}.fill,.switch,button{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brandrow">
      <a class="brand" href="index.html" aria-label="Falaj home">
        <svg width="26" height="20" viewBox="0 0 34 26" aria-hidden="true"><path d="M2 20c6 0 8-12 15-12s9 12 15 12" fill="none" stroke="#0b6fa8" stroke-width="3" stroke-linecap="round"/><path d="M27 9V3M24 5l3-2 3 2" fill="none" stroke="#1a7f52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Falaj
      </a>
      <span class="chip">Demo · synthetic · call simulated</span>
    </div>
    <ol class="segs" id="segs" aria-label="The three moments"></ol>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="foot" id="foot"></div>
</div>
<p class="sr" aria-live="polite" id="say"></p>

<script type="module">
import { registerSW } from './core/pwa.mjs';
registerSW();

// The whole idea in three moments. Synthetic story: Priya, 47, mammogram BI-RADS 4, speaks Malayalam.
const LINES = [
  ['ai', 'Hello Priya. This is the Falaj care line, an automated assistant working with Nurse Huda.'],
  ['ai', 'Your mammogram result is ready. The next step is a short appointment at the breast clinic.'],
  ['me', 'Is it something bad?'],
  ['sys', 'Worry heard: Nurse Huda will call today'],
  ['ai', 'I cannot talk about results. Nurse Huda will call you today to explain. Shall I book the appointment now?'],
  ['me', 'Yes. A morning, please. I work afternoons.'],
  ['ai', 'Booked: Thursday 19 November at 9:30. You will get a reminder the day before.'],
];
const DICT = [
  'Priya, 47, seen today for a BI-RADS 4 finding, left breast.',
  'Ultrasound-guided core biopsy done, no complications.',
  'Results in five days. Follow-up visit on 26 November.',
];
const SHARE = [['r', 'Screening result'], ['a', 'Appointment'], ['l', 'Preferred language'], ['h', 'Other medical history']];
const init = () => ({ step: 0, call: 'ring', n: 0, share: { r: true, a: true, l: true, h: false }, accepted: false, consent: false, rec: 'idle', m: 0 });
const q = new URLSearchParams(location.search);
const FAST = q.get('fast') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = init(), timer = null;
const $ = (s) => document.querySelector(s);
const set = (patch, focus) => { S = { ...S, ...patch }; render(focus); };
const say = (t) => { $('#say').textContent = t; };
const stop = () => { clearInterval(timer); timer = null; };
function tick(key, max, done) {
  stop();
  if (FAST) { set({ [key]: max, ...done }); return; }
  timer = setInterval(() => { const v = S[key] + 1; if (v >= max) { stop(); set({ [key]: v, ...done }); } else set({ [key]: v }); }, 1500);
}

const icPhone = (fill = '#fff', s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="${fill}"/></svg>`;
const icCheck = (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="10" fill="var(--ok)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const sw = (id, on, label) => `<li class="row sw"><span id="${id}-l">${label}</span><button class="switch" id="${id}" role="switch" aria-checked="${on}" aria-labelledby="${id}-l"><span></span></button></li>`;
const row = (k, v) => `<li class="row"><span>${k}</span><span class="v">${v}</span></li>`;
const head = (who, title) => `<div class="head"><p class="eyebrow">${who}</p><h1>${title}</h1></div>`;

function screenCall() {
  let h = head("Priya's phone", 'The call');
  if (S.call === 'ring') return h + `<div class="ringcard pop"><span class="avatar ring">${icPhone('none', 38).replace('fill="none"', 'fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"')}</span>
    <div class="who">Falaj care line</div><div style="font-size:15px;color:var(--muted)">Calling in Malayalam, for Nurse Huda</div>
    <div class="calls"><div><button class="round red" id="decline" aria-label="Decline the call"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c5-5 13-5 18 0l-2 3-4-1v-3a10 10 0 0 0-6 0v3l-4 1z" fill="#fff"/></svg></button>Decline</div>
    <div><button class="round green" id="answer" aria-label="Accept the call">${icPhone()}</button>Accept</div></div></div>
    <p class="note">Priya's mammogram needs a closer look. Instead of a letter she may never open, Falaj calls her, in her own language, at a time that suits her.</p>`;
  if (S.call === 'missed') return h + `<div class="card pop"><div style="font-size:17px;font-weight:600;margin-bottom:6px">No answer</div>
    <div style="font-size:15px;line-height:1.4;color:var(--ink2)">Falaj tries again tomorrow at 6 pm, outside her working hours. After two missed calls, Nurse Huda is told and calls herself.</div>
    <button class="light" id="retry" style="margin-top:12px">Try the call again</button></div>`;
  h += `<div class="card callhead"><span class="a">${icPhone('#fff', 20)}</span><span><b>Falaj care line</b><small>Spoken in Malayalam · transcript in English</small></span><span class="tag${S.call === 'done' ? ' ended' : ''}">${S.call === 'done' ? 'Ended' : 'Live'}</span></div>
    <ol class="chat" aria-label="Call transcript">${LINES.slice(0, S.n).map(([k, t], i) => `<li class="${i === S.n - 1 ? 'pop' : ''}"><span class="b ${k}">${k === 'sys' ? '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v5M12 16v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' : `<span class="sr">${k === 'ai' ? 'Assistant: ' : 'Priya: '}</span>`}${t}</span></li>`).join('')}</ol>`;
  if (S.call === 'done') h += `<div class="group pop"><div class="gh">Booked during the call</div><ul class="list">${row('When', 'Thu 19 Nov · 9:30')}${row('Where', 'Breast clinic')}${row('Reminder', 'The day before')}</ul>
    <div class="gf">The assistant never discusses the result or a diagnosis. When Priya sounds worried, it hands over to Nurse Huda.</div></div>`;
  return h;
}
function screenHand() {
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${head("Dr Mariam's phone · family doctor", 'Referral')}
    <div class="group"><div class="gh">Patient</div><ul class="list">${row('Priya, 47', 'Malayalam')}${row('Mammogram', 'BI-RADS 4')}${row('To', 'Breast clinic')}</ul></div>
    <div class="group"><div class="gh">What Priya chose to share</div><ul class="list">${SHARE.map(([k, l]) => sw('sh-' + k, S.share[k], l)).join('')}</ul><div class="gf">Priya can change this at any time, from her phone.</div></div>
    ${S.accepted
      ? `<div class="card status ok pop" id="hs">${icCheck(24)}<span><b>Accepted by Dr Layla Haddad</b><span>The breast clinic now owns Priya's case. Nothing falls between two doctors.</span></span></div>`
      : `<div class="card status" id="hs"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9" fill="none" stroke="#8a5412" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="#8a5412" stroke-width="2" stroke-linecap="round"/></svg><span><b>Waiting for the breast clinic</b><span>You stay responsible until they accept. If nobody accepts within 2 days, Falaj alerts you.</span></span></div>`}</div>`;
}
function screenClose() {
  let mic = '';
  if (S.rec === 'idle') mic = `<div class="mic"><button class="round blue" id="rec" aria-disabled="${!S.consent}" aria-label="Start the voice note" aria-describedby="rec-h"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button><span id="rec-h">${S.consent ? 'Tap to dictate the note' : 'Turn on consent to record'}</span></div>`;
  if (S.rec === 'live') mic = `<div class="mic live"><button class="round stop rec" id="stoprec" aria-label="Stop the voice note"><span></span></button>Listening…</div>`;
  const dict = S.m ? `<ol class="dict card" aria-label="What the doctor said">${DICT.slice(0, S.m).map((t, i) => `<li class="${i === S.m - 1 ? 'pop' : ''}">“${t}”</li>`).join('')}</ol>` : '';
  const note = S.rec === 'done' ? `<div class="group pop"><div class="gh">Clinical note · draft, check before confirming</div><ul class="list">${row('Seen', '19 Nov, 9:40')}${row('Done', 'Core biopsy, left breast')}${row('Next', 'Results visit 26 Nov')}${row('Owner', 'Breast clinic')}</ul></div>` : '';
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${head("Dr Layla's phone · breast clinic", 'Consultation')}
    <div class="group"><ul class="list"><li class="row"><span>Priya, 47</span><span class="v" style="color:var(--ok);font-weight:600">Checked in · 9:30</span></li>${sw('consent', S.consent, 'Priya agrees to a voice note')}</ul><div class="gf">The audio becomes a written note, then it is deleted.</div></div>
    ${mic}${dict}${note}</div>`;
}
function screenDone() {
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px"><div class="done"><span class="palm"><svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 44V22" stroke="#7a5a2a" stroke-width="3" stroke-linecap="round"/><path d="M24 22c-3-7-11-9-17-6 6 0 11 2 17 6zM24 22c3-7 11-9 17-6-6 0-11 2-17 6zM24 22c-5-4-6-11-3-16 0 6 1 11 3 16zM24 22c5-4 6-11 3-16 0 6-1 11-3 16z" fill="var(--ok)"/><path d="M6 44c6-3 12-3 18 0s12 3 18 0" fill="none" stroke="var(--tint)" stroke-width="3" stroke-linecap="round"/></svg></span>
    <h1>Loop closed</h1><p>Priya reached a specialist 8 days after her result, and a doctor confirmed it.</p></div>
    <div class="group"><div class="gh">Proof of care</div><ul class="list">${[['Called and booked', '11 Nov'], ['Referral accepted', '11 Nov'], ['Seen, note confirmed', '19 Nov']].map(([a, b]) => `<li class="row" style="justify-content:flex-start">${icCheck()}<span style="flex:1">${a}</span><span class="v" style="font-size:15px">${b}</span></li>`).join('')}</ul>
    <div class="gf">The voice recording was deleted. Only the confirmed note is kept.</div></div>
    <p class="more">For the jury: <a href="care.html?role=nurse">the care team's app</a> · <a href="map.html">where results get lost</a> · <a href="trust.html">try to break it</a></p></div>`;
}

function render(focusId) {
  const done = S.step === 3;
  const prog = [{ ring: 12, missed: 12, live: 55, done: 100 }[S.call], S.accepted ? 100 : 45, S.rec === 'done' ? 85 : S.rec === 'live' ? 55 : 20];
  $('#segs').innerHTML = ['Call', 'Hand over', 'Close'].map((l, i) => {
    const w = done || i < S.step ? 100 : i === S.step ? prog[i] : 0;
    return `<li${i === S.step ? ' aria-current="step"' : ''}>${l}<span class="track"><span class="fill" style="width:${w}%;${done ? 'background:var(--ok)' : ''}"></span></span></li>`;
  }).join('');
  $('#main').innerHTML = [screenCall, screenHand, screenClose, screenDone][S.step]();
  let p = null;
  if (S.step === 0 && S.call === 'done') p = ['Next: the doctors hand over', () => go(1)];
  if (S.step === 1) p = S.accepted ? ['Next: the consultation', () => go(2)] : ['Accept as the breast clinic (demo)', () => { set({ accepted: true }, 'next'); say('Accepted by the breast clinic. They now own the case.'); }];
  if (S.step === 2 && S.rec === 'done') p = ['Confirm consultation', () => { go(3); say('Loop closed.'); }, 'go'];
  if (done) p = ['Replay the demo', () => { stop(); S = init(); render(); $('#main').focus(); }];
  $('#foot').innerHTML = p ? `<button class="primary ${p[2] || ''}" id="next">${p[0]}</button>` : '';
  $('#foot').hidden = !p;
  if (p) $('#next').onclick = p[1];
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('answer', () => { set({ call: 'live', n: 1 }); tick('n', LINES.length, { call: 'done' }); });
  on('decline', () => set({ call: 'missed' }, 'retry'));
  on('retry', () => set({ call: 'ring' }, 'answer'));
  SHARE.forEach(([k]) => on('sh-' + k, () => set({ share: { ...S.share, [k]: !S.share[k] } }, 'sh-' + k)));
  on('consent', () => set({ consent: !S.consent }, 'consent'));
  on('rec', () => { if (!S.consent) { say('Turn on consent first.'); return; } set({ rec: 'live', m: 1 }, 'stoprec'); tick('m', DICT.length, { rec: 'done' }); });
  on('stoprec', () => { stop(); set({ rec: 'done', m: DICT.length }, 'next'); });
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}
function go(step) { stop(); S = { ...S, step }; render(); scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true }); }
