<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falaj: call, hand over, close</title>
<meta name="description" content="Falaj in three moments: an AI call holds the visit, the nurse checks understanding, doctors hand over the case, and the loop closes only when the consultation is confirmed. One Care Passport travels with the patient. Synthetic data only.">
<meta name="theme-color" content="#f6f2ea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
/* One continuous journey, seen from four phones. iOS structure (system font, grouped lists, switches, sheets),
   Falaj identity (navy and sand). Green means done, amber means waiting or action needed. Nothing else is coloured.
   Every step changes Priya's real demo case (C-040): the nurse's list, her app and the Care Passport all follow. */
:root{--fill:#0a1f2e;--go:#1a7f52;--bg:#f6f2ea;--card:#fff;--ink:#0a1f2e;--ink2:#2c3e4c;--muted:#56616b;--line:#e6dfd2;--tint:#0b6fa8;--ok:#1a7f52;--ok-l:#e3f4ec;--ok-ink:#0f5a3a;--bad:#c4271b;--warn:#a8670f;--warn-l:#fbefdd;--warn-ink:#7a4a0c;--off:#cbc3b4;--desk:#ebe3d3}
@media (prefers-color-scheme:dark){:root{--fill:#2b6a94;--bg:#07141d;--card:#10232f;--ink:#f3efe6;--ink2:#d7d0c3;--muted:#a3adb5;--line:#203543;--tint:#5fb3e6;--ok:#34a46e;--ok-l:#12301f;--ok-ink:#9be0bd;--bad:#ff5b4f;--warn:#f2c46e;--warn-l:#3a2c12;--warn-ink:#f2c46e;--off:#3a4d5a;--desk:#040c12}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.aside{display:none}
.phone{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.inner{display:flex;flex-direction:column;flex:1 1 auto}
/* On a laptop (the jury's screen): the phone on the right, the moment explained on the left */
@media (min-width:980px){
  body{background:var(--desk)}
  .stage{max-width:1120px;margin:0 auto;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:72px;align-items:center;padding:32px 40px}
  .aside{display:flex;flex-direction:column;gap:18px;max-width:520px}
  .aside .k{font-size:15px;font-weight:700;color:var(--ink2)}
  .aside h2{margin:0;font-size:52px;line-height:1.04;font-weight:800;letter-spacing:-.5px}
  .aside p{margin:0;font-size:20px;line-height:1.45;color:var(--ink2)}
  .aside .rule{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.45}
  .aside .rule b{display:block;margin-bottom:2px}
  .aside .dots{display:flex;gap:8px}
  .aside .dots span{width:28px;height:6px;border-radius:3px;background:var(--off)}
  .aside .dots span.on{background:var(--fill)}
  .phone{position:relative;width:400px;height:min(844px,calc(100vh - 64px));min-height:0;margin:0;border-radius:48px;border:10px solid #0a1f2e;box-shadow:0 30px 80px rgba(10,31,46,.2);overflow:hidden;display:block}
  .phone > .inner{height:100%;overflow-y:auto;overflow-x:hidden}
  .scrim{position:absolute !important}
}
.bar{position:sticky;top:0;z-index:2;padding:calc(14px + env(safe-area-inset-top)) 20px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;min-height:44px}
.chip{font-size:12px;font-weight:600;color:var(--ink2);background:var(--line);padding:5px 10px;border-radius:99px}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.segs li{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.segs li[aria-current=step]{color:var(--ink)}
.track{display:block;height:5px;border-radius:3px;background:var(--off);overflow:hidden}
.fill{display:block;height:100%;border-radius:3px;background:var(--fill);transition:width .7s cubic-bezier(.2,.8,.2,1),background-color .4s}
main{flex:1 1 auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px;outline:none}
.who{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.2px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:0;flex:none}
h1{margin:6px 0 0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.2px}
.head{padding:0 4px}
.ctx{margin:4px 0 0;font-size:15px;color:var(--muted)}
/* the Care Passport: the same card on every phone; only the owner, the next step and the status change */
.pass{background:var(--fill);color:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pass .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.92}
.pass .o{display:flex;align-items:center;gap:10px;font-size:15px}
.pass .o b{font-weight:600}
.pass .n{font-size:14px;opacity:.92}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;text-transform:none;letter-spacing:0;white-space:nowrap}
.st.amber{background:var(--warn-l);color:var(--warn-ink)}.st.green{background:var(--ok-l);color:var(--ok-ink)}
.group{display:flex;flex-direction:column;gap:6px}
.gh,.gf{padding:0 16px;font-size:13px;line-height:1.4;color:var(--muted)}
.gh{text-transform:uppercase}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{position:relative;min-height:44px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}
.row+.row::before,.prow+.prow::before{content:"";position:absolute;inset-inline-start:16px;inset-inline-end:0;top:0;height:1px;background:var(--line)}
.row > span:first-child{white-space:nowrap}
.row .v{color:var(--muted);text-align:end}
.row .v.ok{color:var(--ok);font-weight:600}
.row.sw{padding-block:7px}
.prow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px}
.prow .t{flex:1;min-width:0}
.prow b{display:block;font-size:17px;font-weight:600}
.prow small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.prow .due{font-size:13px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border-radius:14px;padding:14px 16px}
.hl{background:var(--card);border:1.5px solid var(--warn);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hl .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hl .top b{font-size:17px}
.hl .q{font-size:15px;line-height:1.4;color:var(--ink2);margin:0}
.switch{width:51px;height:31px;flex:none;border:0;border-radius:99px;padding:2px;background:var(--off);cursor:pointer;display:flex;justify-content:flex-start;transition:background-color .2s}
.switch[aria-checked=true]{background:var(--go);justify-content:flex-end}
.switch span{width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.ringcard{background:var(--card);border-radius:20px;padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--go);display:grid;place-items:center;margin-bottom:10px}
.ringcard .name{font-size:24px;font-weight:600}
.calls{display:flex;gap:64px;margin-top:22px}
.calls div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.round{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.round.red{background:#c4271b}.round.green{background:var(--go)}.round.blue{background:var(--fill);width:76px;height:76px}
.round[aria-disabled=true]{background:var(--off);cursor:not-allowed}
.callhead{display:flex;align-items:center;gap:12px;padding:12px 14px}
.callhead .a{width:40px;height:40px;border-radius:50%;background:var(--go);display:grid;place-items:center;flex:none}
.callhead b{display:block;font-size:15px}.callhead small{font-size:13px;color:var(--muted)}
.tag{margin-inline-start:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:#c4271b;color:#fff;flex:none}
.tag.ended{background:var(--line);color:var(--ink2)}
.chat{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.chat li{display:flex}
.b{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.38}
.b.ai{background:var(--card);border-radius:18px 18px 18px 6px}
.b.me{margin-inline-start:auto;background:var(--fill);color:#fff;border-radius:18px 18px 6px 18px}
.b.sys{margin-inline:auto;display:inline-flex;align-items:center;gap:6px;background:var(--warn-l);color:var(--warn-ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--fill);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.wide.ghost{background:var(--line);color:var(--ink)}
.status{display:flex;gap:12px;align-items:flex-start}
.status b{display:block;font-size:17px;margin-bottom:3px}.status span{font-size:15px;line-height:1.4;color:var(--ink2)}
.status.ok{background:var(--ok-l)}.status.ok b,.status.ok span{color:var(--ok-ink)}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--muted)}
.mic.live{color:var(--bad);font-weight:600}
.round.stop{background:#c4271b;width:76px;height:76px}
.round.stop span{width:24px;height:24px;border-radius:5px;background:#fff}
.dict{display:flex;flex-direction:column;gap:8px;margin:0;list-style:none}
.dict.card{padding:14px 16px}
.dict li{font-size:15px;line-height:1.45;color:var(--ink2)}
.closedhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px 0}
.closedhero .palm{width:84px;height:84px;border-radius:50%;background:var(--ok-l);display:grid;place-items:center;margin-bottom:6px}
.closedhero p{margin:0;font-size:17px;line-height:1.4;color:var(--ink2)}
.proof{display:flex;gap:14px;align-items:center}
.proof .qr{border-radius:8px;flex:none}
.proof b{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase}
.proof code{display:block;font:600 17px ui-monospace,"SF Mono",Menlo,monospace;margin:2px 0 6px}
.proof small{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.proof a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:600;color:var(--tint)}
details.more{background:var(--card);border-radius:12px;overflow:hidden}
details.more summary{min-height:44px;padding:11px 16px;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"›";color:var(--muted);font-size:22px;transition:transform .2s}
details.more[open] summary::after{transform:rotate(90deg)}
details.more .list{border-radius:0;border-top:1px solid var(--line)}
.links{margin:0;padding:0;list-style:none}
.links a{display:flex;align-items:center;justify-content:space-between;color:var(--ink);text-decoration:none;flex:1}
.links a::after{content:"›";color:var(--muted);font-size:22px}
.foot{padding:10px 16px calc(18px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.primary{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--fill);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.light{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--line);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.xorg{display:flex;flex-direction:column;gap:6px}
.xorg .xo{display:flex;align-items:center;gap:10px}
.xorg .xo b{display:block;font-size:17px}.xorg .xo small{display:block;font-size:13px;color:var(--muted)}
.xorg .xa{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:13px;font-weight:700;padding-inline-start:2px}
.xorg .xt{margin:6px 0 0;font-size:14px;line-height:1.45;color:var(--ink2)}
.back{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:none;color:var(--tint);font:inherit;font-size:17px;cursor:pointer}
/* the sheet: the draft note, only when the doctor asks to review it */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,31,46,.4);display:flex;align-items:flex-end;animation:fade .2s both}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .34s cubic-bezier(.2,.8,.2,1) both;outline:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--off);align-self:center}
.sheet h2{margin:0;font-size:22px;font-weight:700}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
p.note{margin:0;padding:0 16px;font-size:13px;line-height:1.4;color:var(--muted)}
button{-webkit-tap-highlight-color:transparent;transition:opacity .12s,transform .12s}
button:active{opacity:.75;transform:scale(.98)}
button:focus-visible,a:focus-visible,summary:focus-visible,.inner:focus-visible{outline:3px solid #36b5e8;outline-offset:2px}
.pop{animation:pop .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(26,127,82,.45)}100%{box-shadow:0 0 0 26px rgba(26,127,82,0)}}
.rec{animation:rec 1.2s ease-out infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 rgba(196,39,27,.4)}100%{box-shadow:0 0 0 22px rgba(196,39,27,0)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
@media (prefers-reduced-motion:reduce){.pop,.ring,.rec,.scrim,.sheet{animation:none}.fill,.switch,button,details.more summary::after{transition:none}::view-transition-old(root),::view-transition-new(root){animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <aside class="aside" id="aside" aria-hidden="true"></aside>
  <div class="phone" id="phone">
    <div class="inner" id="inner" tabindex="0" role="region" aria-label="Phone screen">
      <header class="bar" id="bar">
        <div class="brandrow">
          <a class="brand" href="index.html" aria-label="Falaj home">
            <svg width="26" height="20" viewBox="0 0 34 26" aria-hidden="true"><path d="M2 20c6 0 8-12 15-12s9 12 15 12" fill="none" stroke="#0b6fa8" stroke-width="3" stroke-linecap="round"/><path d="M27 9V3M24 5l3-2 3 2" fill="none" stroke="#1a7f52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Falaj
          </a>
          <span class="chip">Demo · synthetic · call simulated</span>
        </div>
        <ol class="segs" id="segs" aria-label="The three moments"></ol>
      </header>
      <main id="main" tabindex="-1"></main>
      <div class="foot" id="foot"></div>
    </div>
    <div id="sheetroot"></div>
  </div>
</div>
<p class="sr" aria-live="polite" id="say"></p>

<script type="module">
import { registerSW } from './core/pwa.mjs';
import { loadState, saveState } from './core/store.mjs';
import { buildState } from './core/data.mjs';
import { addDays } from './core/rules.mjs';
import { advance, skipStage, sendReferral, respondReferral, closeCase, requestNurse, logEvent, nextStageOf } from './core/cases.mjs';
import { proofUrl } from './core/proof.mjs';
import { passportHtml, milestones } from './core/passport.mjs';
registerSW();

// ---- The story runs on Priya's real demo case. A week of care is compressed into a minute. ----
const ID = 'C-040';
let state = loadState();
const TODAY = state.today;
const GP_DAY = addDays(TODAY, 1), SPEC_DAY = addDays(TODAY, 8);
const fmt = (d, long) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' } : { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const staff = (id) => ({ type: 'staff', ...state.staff.find((s) => s.id === id) });
const NURSE = staff('n2'), GP = staff('d1'), SPEC = staff('e4');
const PATIENT = { type: 'patient', name: 'Priya Raman (patient)' };
const AICALL = { type: 'system', name: 'Falaj care line (AI call, simulated)' };
const first = (n) => n.replace(/^(Nurse|Dr)\s+/, '').split(' ')[0];
const initials = (n) => n.replace(/^(Nurse|Dr)\s+/, '').split(' ').map((w) => w[0]).slice(0, 2).join('');
const NURSE_NAME = 'Nurse ' + first(NURSE.name), GP_NAME = 'Dr ' + first(GP.name), SPEC_NAME = 'Dr ' + first(SPEC.name);
const PEOPLE = {
  priya: ['PR', "Priya's phone", '#0b6fa8', 'Priya'],
  nurse: [initials(NURSE.name), `${NURSE_NAME}'s phone · care team`, '#8a5412', `${NURSE_NAME} · care team`],
  gp: [initials(GP.name), `${GP_NAME}'s phone · family doctor`, '#1a7f52', `${GP_NAME} · family doctor`],
  spec: [initials(SPEC.name), `${SPEC_NAME}'s phone · breast clinic`, '#6b3fa0', `${SPEC_NAME} · breast clinic`],
};
const SHORT = { hba1c: 'HbA1c', fit: 'Bowel test (FIT)', mammo: 'Mammogram' };
const ACTION = { notified: 'Contact the patient', understood: 'Check understanding', booked: 'Help to book', attended: 'Confirm the visit', confirmed: 'Record the test', referred: 'Decide on referral', care_plan: 'Agree the plan', closed: 'Close with evidence' };

function freshCase() {   // Priya's case as the demo data has it: the result is out, nobody has reached her
  const fresh = buildState(TODAY).cases.find((x) => x.id === ID);
  state.cases = state.cases.map((x) => (x.id === ID ? fresh : x));
  saveState(state);
}
const C = () => state.cases.find((x) => x.id === ID);
const at = (day, hm) => `${day}T${hm}:00.000Z`;
const stamp = (from, day, hm) => { C().events.slice(from).forEach((e) => { e.at = at(day, hm); }); };  // compressed demo time
function act(fn) {
  try { const n = C().events.length; fn(n); saveState(state); return true; }
  catch (e) { say('Could not record this step: ' + e.message); console.error(e); return false; }
}
function daysSinceResult() { const c = state.cases.find((x) => x.id === ID); return c ? Math.round((Date.parse(TODAY) - Date.parse(c.resultDay)) / 864e5) : 3; }

const LINES = [
  ['ai', `Hello Priya. This is the Falaj care line, an automated assistant working with ${NURSE_NAME}.`],
  ['ai', 'Your mammogram result is ready. The next step is a visit with your family doctor.'],
  ['me', 'Is it something bad?'],
  ['sys', `Worry heard: ${NURSE_NAME} will call today`],
  ['ai', `I cannot talk about results. ${NURSE_NAME} will call you today to explain. Shall I hold a visit for you?`],
  ['me', 'Yes. A morning, please. I work afternoons.'],
  ['ai', `Held: ${fmt(GP_DAY, true)} at 9:30 with ${GP_NAME}. ${NURSE_NAME} will confirm it with you today.`],
];
const DICT = [
  'Priya, 47, seen today for a BI-RADS 4 finding, left breast.',
  'Ultrasound-guided core biopsy done, no complications.',
  'Results in five days. Follow-up visit at the breast clinic booked.',
];
const SHARE = [['r', 'Screening result'], ['a', 'Appointments'], ['l', 'Preferred language'], ['h', 'Other medical history']];
const ASIDE = [
  ['Moment 1 of 3 · The call', 'Nobody reached Priya. Falaj calls.', `The result has waited ${daysSinceResult()} days. Instead of a letter, an AI assistant calls Priya in Malayalam and holds a visit around her work.`, 'The rule', 'The AI never discusses a result. Worry goes to a person, the same day.'],
  ['Moment 1 of 3 · The nurse', 'A person checks she understood.', `${NURSE_NAME}'s list says who needs a call and why. Priya explains the next step back in her own words. Only then is the visit confirmed.`, 'The rule', 'The AI routes people to the right human. It never replaces one.'],
  ['Moment 2 of 3 · The hand over', 'Two organisations. One passport.', `${GP_NAME}, in a private family clinic, refers Priya to a public hospital's breast clinic: another organisation, another record system. A single-hospital tool loses her here. The Care Passport goes with her, and the owner changes only when the clinic accepts.`, 'The rule', 'The sender stays responsible until the specialist accepts. No reply in 2 days raises an alarm.'],
  ['Moment 3 of 3 · The close', 'The loop closes in the consultation.', `With Priya's consent, ${SPEC_NAME} dictates. The words become a draft note the doctor reviews, then confirms.`, 'The rule', 'A booked appointment is not care. Only a confirmed consultation closes the loop.'],
  ['Loop closed', 'One result. One passport. One journey.', 'The passport travelled with Priya across four phones. Each stamp was pressed by the person who did the step: the nurse, the family doctor, the specialist.', 'Try it', 'Scan the QR code with a phone. It shows the journey and who did each step, never the result.'],
];

const init = () => ({ step: 0, call: 'ring', n: 0, nurse: 'idle', share: { r: true, a: true, l: true, h: false }, hand: 'list', consent: false, rec: 'idle', m: 0, sheet: false });
const q = new URLSearchParams(location.search);
const FAST = q.get('fast') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = init(), timer = null;
const $ = (s) => document.querySelector(s);
const set = (patch, focus) => { S = { ...S, ...patch }; render(focus); };
const say = (t) => { $('#say').textContent = t; };
const stop = () => { clearInterval(timer); timer = null; };
function tick(key, max, done) {
  stop();
  if (FAST) { set({ [key]: max, ...done }); return; }
  timer = setInterval(() => { const v = S[key] + 1; if (v >= max) { stop(); set({ [key]: v, ...done }); } else set({ [key]: v }); }, 1500);
}

// ---- what each tap records in the case ----
function callEnded() {
  act((n) => {
    logEvent(C(), 'contact', AICALL, `AI call in Malayalam. Visit held with the family doctor, ${fmt(GP_DAY)} 9:30, to be confirmed by the nurse.`);
    requestNurse(state, ID, PATIENT, 'Asked "Is it something bad?" during the Falaj call');
    stamp(n, TODAY, '09:05');
  });
}
function nurseCalled() {
  act((n) => {
    logEvent(C(), 'contact', NURSE, 'Result explained by phone, with a Malayalam interpreter line.');
    advance(state, ID, 'understood', NURSE, 'Teach-back: Priya explained the next step in her own words.');
    advance(state, ID, 'booked', PATIENT, `Booked by phone during the Falaj call: family doctor, ${fmt(GP_DAY)} 9:30. Confirmed by ${NURSE_NAME}.`);
    C().slot = { day: GP_DAY, time: '09:30' };
    if (C().nurseRequest) C().nurseRequest.done = true;
    stamp(n, TODAY, '11:20');
  });
}
const referralSent = () => act((n) => {
  advance(state, ID, 'attended', GP, 'Seen by the family doctor.');
  skipStage(state, ID, 'confirmed', GP, 'The biopsy is done at the breast clinic.');
  sendReferral(state, ID, GP, { to: 'Breast clinic', reason: 'BI-RADS 4 finding: breast assessment and biopsy.' });
  C().referral.shared = SHARE.filter(([k]) => S.share[k]).map(([, l]) => l);
  stamp(n, GP_DAY, '09:50');
});
const referralAccepted = () => act((n) => {
  respondReferral(state, ID, SPEC, { accept: true, note: `Biopsy visit booked for ${fmt(SPEC_DAY)}.` });
  stamp(n, GP_DAY, '14:10');
});
const consultationConfirmed = () => act((n) => {
  closeCase(state, ID, SPEC, { type: 'transferred_care', evidence: DICT.join(' ') });
  C().closed.at = at(SPEC_DAY, '09:55');
  stamp(n, SPEC_DAY, '09:55');
});

// ---- the Care Passport: who owns Priya's case now, what comes next, and is it care yet ----
function passport() {
  const s = S.step;
  if (s === 4) return ['spec', 'Results visit in 5 days', 'Loop closed', 'green'];
  if (s === 3) return ['spec', 'Confirm the consultation', 'In consultation', 'amber'];
  if (s === 2) return S.hand === 'accepted' ? ['spec', `Consultation, ${fmt(SPEC_DAY)}`, 'Booked · not yet care', 'amber']
    : S.hand === 'sent' ? ['gp', 'Breast clinic to accept', 'Waiting for acceptance', 'amber']
    : ['gp', 'Refer to the breast clinic', 'Action needed', 'amber'];
  if (s === 1 && S.nurse === 'done') return ['nurse', `Visit with ${GP_NAME}, ${fmt(GP_DAY)}`, 'Booked · not yet care', 'amber'];
  if (s === 1 || S.call === 'done') return ['nurse', 'Check Priya understood', 'Visit held', 'amber'];
  return ['nurse', 'Reach Priya', 'Not reached', 'amber'];
}
let lastDone = null;   // which stamps were already there, so a new one is pressed in with a small animation
function passCard() {
  const [o, next, st, tone] = passport();
  const done = milestones(C()).map(([x]) => x === 'done');
  const fresh = lastDone ? done.map((d, i) => (d && !lastDone[i] ? i : -1)).filter((i) => i >= 0) : [];
  lastDone = done;
  return passportHtml(C(), { compact: true, owner: PEOPLE[o][3], next, status: st, tone, fresh });
}

// ---- small pieces ----
const icPhone = (fill = '#fff', s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="${fill}"/></svg>`;
const icPhoneLine = (s = 38) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const icCheck = (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="10" fill="var(--ok)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const icClock = `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"/></svg>`;
const sw = (id, on, label) => `<li class="row sw"><span id="${id}-l">${label}</span><button class="switch" id="${id}" role="switch" aria-checked="${on}" aria-labelledby="${id}-l"><span></span></button></li>`;
const row = (k, v, cls = '') => `<li class="row"><span>${k}</span><span class="v ${cls}">${v}</span></li>`;
const head = (p, title, ctx) => { const [ini, label, col] = PEOPLE[p]; return `<div class="head"><p class="who"><span class="av" style="background:${col}" aria-hidden="true">${ini}</span>${label}</p><h1>${title}</h1>${ctx ? `<p class="ctx">${ctx}</p>` : ''}</div>`; };
const prow = (c, extra) => {
  const nxt = nextStageOf(c), late = c.due && c.due < TODAY;
  return `<li class="prow"><span class="t"><b>${c.patient.name.split(' ')[0]}, ${c.patient.age}</b><small>${SHORT[c.programme || 'hba1c']} · ${extra || ACTION[nxt] || 'Follow up'}</small></span>${late ? '<span class="st amber">Overdue</span>' : `<span class="due">Due ${fmt(c.due)}</span>`}</li>`;
};

// ---- the screens ----
function screenCall() {
  let h = head('priya', 'The call', `Day ${daysSinceResult()} after the result. The letter is still unopened.`) + passCard();
  if (S.call === 'ring') return h + `<div class="ringcard pop"><span class="avatar ring">${icPhoneLine()}</span>
    <div class="name">Falaj care line</div><div style="font-size:15px;color:var(--muted)">Calling in Malayalam, for ${NURSE_NAME}</div>
    <div class="calls"><div><button class="round red" id="decline" aria-label="Decline the call"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c5-5 13-5 18 0l-2 3-4-1v-3a10 10 0 0 0-6 0v3l-4 1z" fill="#fff"/></svg></button>Decline</div>
    <div><button class="round green" id="answer" aria-label="Accept the call">${icPhone()}</button>Accept</div></div></div>`;
  if (S.call === 'missed') return h + `<div class="card pop"><div style="font-size:17px;font-weight:600;margin-bottom:6px">No answer</div>
    <div style="font-size:15px;line-height:1.4;color:var(--ink2)">Falaj tries again tomorrow at 6 pm, outside her working hours. After two missed calls, ${NURSE_NAME} is told and calls in person.</div>
    <button class="light" id="retry" style="margin-top:12px">Try the call again</button></div>`;
  h += `<div class="card callhead"><span class="a">${icPhone('#fff', 20)}</span><span><b>Falaj care line</b><small>Spoken in Malayalam · transcript in English</small></span><span class="tag${S.call === 'done' ? ' ended' : ''}">${S.call === 'done' ? 'Ended' : 'Live'}</span></div>
    <ol class="chat" aria-label="Call transcript">${LINES.slice(0, S.n).map(([k, t], i) => `<li class="${i === S.n - 1 ? 'pop' : ''}"><span class="b ${k}">${k === 'sys' ? '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v5M12 16v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' : `<span class="sr">${k === 'ai' ? 'Assistant: ' : 'Priya: '}</span>`}${t}</span></li>`).join('')}</ol>`;
  if (S.call === 'done') h += `<p class="note pop">The assistant never discusses the result or a diagnosis. The visit is held, not confirmed: a person checks first.</p>`;
  return h;
}
function screenNurse() {
  const others = state.cases.filter((c) => c.owner === NURSE.id && c.id !== ID && c.stage !== 'closed').sort((a, b) => (a.due || '').localeCompare(b.due || '')).slice(0, 3);
  const call = S.nurse === 'idle'
    ? `<button class="wide" id="callp">${icPhone('#fff', 20)} Call Priya</button>`
    : S.nurse === 'calling'
      ? `<div class="mic live"><span>Calling Priya, with a Malayalam interpreter line…</span></div>`
      : `<div class="card status ok pop" style="padding:12px 14px">${icCheck(24)}<span><b>Understood. Visit confirmed.</b><span>In her own words: “They need a closer look. It does not mean it is cancer. I see my doctor on ${fmt(GP_DAY, true).split(' ')[0]}.”</span></span></div>`;
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${head('nurse', 'Needs your attention', fmt(TODAY, true))}${passCard()}
    <div class="hl"><div class="top"><b>Priya, 47 · Malayalam</b><span class="st amber">Call today</span></div>
      <p class="q">Mammogram, BI-RADS 4. Worried during the Falaj call: “Is it something bad?”</p>
      ${call}</div>
    <div class="group"><div class="gh">Also today</div><ul class="list">${others.map((c) => prow(c)).join('')}</ul></div></div>`;
}
function screenHand() {
  if (S.hand === 'list') {
    const others = state.cases.filter((c) => c.id !== ID && ['attended', 'confirmed'].includes(c.stage)).slice(0, 2);
    return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${head('gp', 'Needs your attention', fmt(GP_DAY, true))}${passCard()}
      <div class="hl"><div class="top"><b>Priya, 47</b><span class="st amber">Action needed</span></div>
        <p class="q">Mammogram, BI-RADS 4 · seen this morning · needs a referral to the breast clinic.</p>
        <button class="wide" id="openp">Review Priya</button></div>
      ${others.length ? `<div class="group"><div class="gh">Also today</div><ul class="list">${others.map((c) => prow(c)).join('')}</ul></div>` : ''}</div>`;
  }
  const status = S.hand === 'seen'
    ? `<div class="card status">${icClock}<span><b>You stay responsible</b><span>Until the breast clinic accepts. If nobody accepts within 2 days, Falaj alerts you.</span></span></div>`
    : S.hand === 'sent'
      ? `<div class="card status pop" id="hs">${icClock}<span><b>Waiting for the breast clinic</b><span>Sent ${fmt(GP_DAY)}, 9:50. You are still responsible for Priya.</span></span></div>`
      : `<div class="card status ok pop" id="hs">${icCheck(24)}<span><b>Accepted by ${SPEC_NAME}</b><span>The breast clinic now owns Priya's case.</span></span></div>`;
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${S.hand === 'seen' ? '<button class="back" id="backlist">‹ Needs your attention</button>' : ''}${head('gp', 'Referral', 'Priya, 47 · Mammogram, BI-RADS 4')}${passCard()}
    <section class="card xorg" aria-label="The hand over">
      <div class="xo"><span class="av" style="background:#1a7f52" aria-hidden="true">MA</span><span><b>Family clinic</b><small>Private network · ${GP_NAME}</small></span></div>
      <div class="xa" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${S.hand === 'accepted' ? 'Passport handed over' : 'Passport travels'}</span></div>
      <div class="xo"><span class="av" style="background:#6b3fa0" aria-hidden="true">NA</span><span><b>Breast clinic</b><small>Public hospital · ${SPEC_NAME}</small></span></div>
      <p class="xt">Two organisations, two record systems. What travels with Priya: her language (Malayalam), what she chose to share, and the name of the person responsible. Her records stay where they are.</p>
    </section>
    <div class="group"><div class="gh">What Priya chose to share</div><ul class="list">${SHARE.map(([k, l]) => sw('sh-' + k, S.share[k], l)).join('')}</ul><div class="gf">Priya can change this at any time, from her phone.</div></div>
    ${status}</div>`;
}
function screenClose() {
  let mic = '';
  if (S.rec === 'idle') mic = `<div class="mic"><button class="round blue" id="rec" aria-disabled="${!S.consent}" aria-label="Start the voice note" aria-describedby="rec-h"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button><span id="rec-h">${S.consent ? 'Tap to dictate the note' : 'Turn on consent to record'}</span></div>`;
  if (S.rec === 'live') mic = `<div class="mic live"><button class="round stop rec" id="stoprec" aria-label="Stop the voice note"><span></span></button>Listening…</div>`;
  const dict = S.m ? `<ol class="dict card" aria-label="What the doctor said">${DICT.slice(0, S.m).map((t, i) => `<li class="${i === S.m - 1 ? 'pop' : ''}">“${t}”</li>`).join('')}</ol>` : '';
  const ready = S.rec === 'done' ? `<div class="card status ok pop" style="padding:12px 14px">${icCheck(24)}<span><b>Draft note ready</b><span>Written from the voice note. The audio is deleted once you confirm.</span></span></div>` : '';
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px">${head('spec', 'Consultation', `${fmt(SPEC_DAY, true)} · Priya, 47`)}${passCard()}
    <div class="group"><ul class="list">${sw('consent', S.consent, 'Priya agrees to a voice note')}</ul><div class="gf">The audio becomes a written note, then it is deleted.</div></div>
    ${mic}${dict}${ready}</div>`;
}
function screenDone() {
  const c = C(), url = proofUrl(c, location.origin);
  const days = Math.round((Date.parse(SPEC_DAY) - Date.parse(c.resultDay)) / 864e5);
  lastDone = milestones(c).map(([x]) => x === 'done');
  return `<div class="pop" style="display:flex;flex-direction:column;gap:18px"><div class="closedhero"><span class="palm"><svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 44V22" stroke="#7a5a2a" stroke-width="3" stroke-linecap="round"/><path d="M24 22c-3-7-11-9-17-6 6 0 11 2 17 6zM24 22c3-7 11-9 17-6-6 0-11 2-17 6zM24 22c-5-4-6-11-3-16 0 6 1 11 3 16zM24 22c5-4 6-11 3-16 0 6-1 11-3 16z" fill="var(--ok)"/><path d="M6 44c6-3 12-3 18 0s12 3 18 0" fill="none" stroke="var(--tint)" stroke-width="3" stroke-linecap="round"/></svg></span>
    <h1>Loop closed</h1><p>Priya reached a specialist ${days} days after her result, and a doctor confirmed it.</p></div>
    ${passportHtml(c, { qr: true, staff: state.staff, link: url.replace(location.origin + '/', ''), fresh: [4] })}
    <div class="group"><div class="gh">The same passport, everywhere</div><ul class="list links"><li class="row"><a href="care.html?role=nurse&as=${NURSE.id}">In ${NURSE_NAME}'s care app</a></li><li class="row"><a href="patient.html?p=${ID}&view=proof&nosplash=1">In Priya's app</a></li></ul></div></div>`;
}
function sheetHtml() {
  return `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" tabindex="-1" id="sheet">
    <span class="grab" aria-hidden="true"></span><h2 id="sheet-t">Clinical note · draft</h2>
    <ul class="list">${row('Seen', `${fmt(SPEC_DAY)}, 9:40`)}${row('Done', 'Core biopsy, left breast')}${row('Next', 'Results in 5 days')}${row('Owner', 'Breast clinic')}</ul>
    <p class="note" style="padding:0 4px">Check it before confirming. Confirming closes the loop and deletes the audio.</p>
    <button class="wide" id="confirm" style="background:var(--go)">Confirm consultation</button>
    <button class="wide ghost" id="sheetback">Back</button></div></div>`;
}

const SCREENS = [screenCall, screenNurse, screenHand, screenClose, screenDone];
function render(focusId) {
  const done = S.step === 4, seg = [0, 0, 1, 2, 3][S.step];
  const prog = [S.step === 1 ? (S.nurse === 'done' ? 100 : 75) : { ring: 10, missed: 10, live: 40, done: 60 }[S.call], { list: 15, seen: 30, sent: 60, accepted: 100 }[S.hand], S.rec === 'done' ? 85 : S.rec === 'live' ? 55 : 20];
  $('#segs').innerHTML = ['Call', 'Hand over', 'Close'].map((l, i) => {
    const w = done || i < seg ? 100 : i === seg ? prog[i] : 0;
    return `<li${i === seg && !done ? ' aria-current="step"' : ''}>${l}<span class="track"><span class="fill" style="width:${w}%;${done ? 'background:var(--ok)' : ''}"></span></span></li>`;
  }).join('');
  const a = ASIDE[S.step];
  $('#aside').innerHTML = `<div class="dots">${[0, 1, 2].map((i) => `<span class="${done || i <= seg ? 'on' : ''}"></span>`).join('')}</div><div class="k">${a[0]}</div><h2>${a[1]}</h2><p>${a[2]}</p><div class="rule">${icCheck(24)}<span><b>${a[3]}</b>${a[4]}</span></div>`;
  $('#main').innerHTML = SCREENS[S.step]();
  // one primary action per screen
  let p = null;
  if (S.step === 0 && S.call === 'done') p = [`Next: ${NURSE_NAME}'s phone`, () => go(1)];
  if (S.step === 1 && S.nurse === 'done') p = [`Next: ${GP_NAME}'s phone`, () => go(2)];
  if (S.step === 2 && S.hand !== 'list') p = S.hand === 'seen' ? ['Send referral to the breast clinic', () => { if (referralSent()) { set({ hand: 'sent' }, 'next'); say('Referral sent. You stay responsible until it is accepted.'); } }]
    : S.hand === 'sent' ? ['Accept as the breast clinic (demo)', () => { if (referralAccepted()) { set({ hand: 'accepted' }, 'next'); say(`Accepted by ${SPEC_NAME}. The Care Passport moves to the breast clinic.`); } }]
    : [`Next: ${SPEC_NAME}'s phone`, () => go(3)];
  if (S.step === 3 && S.rec === 'done') p = ['Review and confirm', () => set({ sheet: true })];
  if (done) p = ['Replay the demo', () => { stop(); freshCase(); lastDone = null; S = init(); go(0); }];
  $('#foot').innerHTML = p ? `<button class="primary" id="next">${p[0]}</button>` : '';
  $('#foot').hidden = !p;
  if (p) $('#next').onclick = p[1];
  // the sheet
  $('#sheetroot').innerHTML = S.sheet ? sheetHtml() : '';
  ['#bar', '#main', '#foot'].forEach((s) => { $(s).inert = !!S.sheet; });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  if (S.sheet) {
    const close = () => set({ sheet: false }, 'next');
    on('sheetback', close);
    on('scrim', (e) => { if (e.target.id === 'scrim') close(); });
    $('#sheet').onkeydown = (e) => { if (e.key === 'Escape') close(); };
    on('confirm', () => { if (consultationConfirmed()) { S = { ...S, sheet: false }; go(4); say('Loop closed.'); } });
    if (!focusId) focusId = 'sheet';
  }
  on('answer', () => { set({ call: 'live', n: 1 }); tick('n', LINES.length, { call: 'done' }); });
  on('decline', () => set({ call: 'missed' }, 'retry'));
  on('retry', () => set({ call: 'ring' }, 'answer'));
  on('callp', () => { set({ nurse: 'calling' }); const fin = () => { nurseCalled(); set({ nurse: 'done' }, 'next'); say('Priya understood. Visit confirmed.'); }; FAST ? fin() : setTimeout(fin, 1800); });
  on('openp', () => { set({ hand: 'seen' }); $('#main').focus(); });
  on('backlist', () => set({ hand: 'list' }, 'openp'));
  SHARE.forEach(([k]) => on('sh-' + k, () => set({ share: { ...S.share, [k]: !S.share[k] } }, 'sh-' + k)));
  on('consent', () => set({ consent: !S.consent }, 'consent'));
  on('rec', () => { if (!S.consent) { say('Turn on consent first.'); return; } set({ rec: 'live', m: 1 }, 'stoprec'); tick('m', DICT.length, { rec: 'done' }); });
  on('stoprec', () => { stop(); set({ rec: 'done', m: DICT.length }, 'next'); });
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}
const HOOKS = { 1: callEnded };   // leaving the call writes it into the case
function go(step) {
  stop();
  if (HOOKS[step] && S.step === step - 1) HOOKS[step]();
  const swap = () => { S = { ...S, step }; render(); $('#inner').scrollTop = 0; scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true }); };
  if (document.startViewTransition && !FAST) document.startViewTransition(swap); else swap();
}

freshCase();
render();
</script>
</body>
</html>
