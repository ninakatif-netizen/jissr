<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falaj for patients</title>
<meta name="description" content="The Falaj patient app: your next step, your Care Passport, your result in plain words, and someone to help. Synthetic data only.">
<meta name="theme-color" content="#f6f2ea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="ios.css">
<style>
.call{position:fixed;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
@media (min-width:980px){.call{position:absolute}}
.call .in{max-width:480px;margin:0 auto;width:100%;padding:calc(18px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.ringcard{background:var(--card);border-radius:20px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--go);display:grid;place-items:center;margin-bottom:10px}
.ringcard .name{font-size:24px;font-weight:600}
.calls{display:flex;gap:64px;margin-top:22px}
.calls div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.round{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.round.red{background:#c4271b}.round.green{background:var(--go)}
.chat{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.chat li{display:flex}
.b{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.38}
.b.ai{background:var(--card);border-radius:18px 18px 18px 6px}
.b.me{margin-inline-start:auto;background:var(--fill);color:#fff;border-radius:18px 18px 6px 18px}
.b.sys{margin-inline:auto;background:var(--warn-l);color:var(--warn-ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
[dir=rtl] .b.ai{border-radius:18px 18px 6px 18px}[dir=rtl] .b.me{border-radius:18px 18px 18px 6px}
.explain{font-size:17px;line-height:1.55;margin:0;white-space:pre-line}
.langs{display:flex;gap:4px}
.langs button{min-height:44px;min-width:44px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
.langs button[aria-pressed=true]{color:var(--ink);background:var(--line)}
.fam-q{display:flex;gap:14px;align-items:center}
.fam-q .qr{flex:none;border-radius:6px}
</style>
</head>

function params() { const q = new URLSearchParams(location.search); return { p: q.get('p') || store.get('falaj.me.p') || '', tab: q.get('tab') || 'home', lang: q.get('lang') || store.get('falaj.me.lang') || 'en' }; }
function nav(p, push = true) {
  const next = { ...params(), ...p }, q = new URLSearchParams();
  if (next.p) q.set('p', next.p); if (next.tab && next.tab !== 'home') q.set('tab', next.tab); if (next.lang === 'ar') q.set('lang', 'ar');
  const url = location.pathname + (q.toString() ? '?' + q : '');
  if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
  sheet = null; render(); $('#inner').scrollTop = 0; scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true });
}
addEventListener('popstate', () => { sheet = null; render(); });

function act(fn, msg) {
  try { fn(); saveState(state); toast(msg); return true; }
  catch (e) { sheetErr = e.message; render(); return false; }
}

    if (act(() => { const x = (c.shares || []).find((y) => y.id === id); if (x) { x.stopped = true; x.stoppedAt = new Date().toISOString(); logEvent(c, 'share_stopped', P, `Stopped sharing with ${x.to}`); } }, t.shStopped)) render();
  });
  on('tbcheck', () => {
    tb = pick('tb') || null; if (!tb) return;
    if (tb === 'ok') { if (act(() => advance(state, c.id, 'understood', P, 'Teach-back in the app: chose the right next step.'), t.understood)) { tb = null; nav({ tab: 'home' }); } }
    else render();
  });
  on('ics', () => {
    const d = c.slot.day.replace(/-/g, ''), tm = c.slot.time.replace(':', '') + '00';
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Falaj demo//EN', 'BEGIN:VEVENT', `UID:${c.id}-${d}@falaj-demo`, `DTSTAMP:${d}T000000Z`, `DTSTART;TZID=Asia/Dubai:${d}T${tm}`, 'DURATION:PT20M', 'SUMMARY:Family doctor visit (Falaj demo)', 'DESCRIPTION:Demo only. Synthetic data.', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'visit.ics'; a.click();
  });
  // family helper
  on('faminvite', () => {
    const name = $('#fn').value.trim(), rel = $('#fr').value.trim(), phone = normaliseUaeMobile($('#fp').value), via = pick('via');
    famErr = !name ? t.needName : !phone ? t.badPhone : !$('#fc').checked ? t.needConsent : '';
    if (famErr) { render(); return; }
    const helper = { name, relation: rel, phone, via };
    if (act(() => { c.familyHelper = { ...helper, token: familyToken(c.id, helper), at: new Date().toISOString(), accepted: false, revoked: false }; logEvent(c, 'family', P, `Invited ${name} as family helper (appointments only)`); }, t.invited(name))) render();
  });
  on('famstop', () => { if (act(() => { c.familyHelper = { ...c.familyHelper, revoked: true, accepted: false, revokedAt: new Date().toISOString() }; logEvent(c, 'family', P, 'Stopped sharing with the family helper'); }, t.stopped)) render(); });
  // sheets
  if (sheet) {
    const close = () => { sheet = null; sheetErr = ''; render(); };
    on('sh-x', close); $('#scrim').onclick = (e) => { if (e.target.id === 'scrim') close(); };
    $('#sheet').onkeydown = (e) => { if (e.key === 'Escape') close(); };
    const done = (fn, msg) => { if (act(fn, msg)) { sheet = null; sheetErr = ''; render(); } };
    on('do-book', () => { const [day, time] = (pick('slot') || '|').split('|'); done(() => {
      if (c.stage === 'understood') advance(state, c.id, 'booked', P, `Booked in the app: ${day} ${time}.`); else logEvent(c, 'rebooked', P, `Moved the visit to ${day} ${time}.`);
      c.slot = { day, time }; c.hold = null;
    }, t.booked); });
    document.querySelectorAll('[data-shitem]').forEach((b) => b.onclick = () => {
      const k = b.dataset.shitem; shareDraft.to = pick('shto') || shareDraft.to; shareDraft.for = pick('shfor') || shareDraft.for;
      shareDraft.items = shareDraft.items.includes(k) ? shareDraft.items.filter((x) => x !== k) : [...shareDraft.items, k];
      render(); document.querySelector(`[data-shitem="${k}"]`).focus();
    });
    on('do-share', () => {
      const to = pick('shto') || 'doctor', f = pick('shfor') || 'week';
      const until = f === 'open' ? null : new Date(Date.now() + (f === 'day' ? 1 : 7) * 864e5).toISOString();
      const id = Array.from(crypto.getRandomValues(new Uint8Array(6)), (x) => x.toString(36).padStart(2, '0')).join('').slice(0, 10).toUpperCase();
      done(() => { c.shares = [...(c.shares || []), { id, to, items: shareDraft.items, until, at: new Date().toISOString() }]; logEvent(c, 'shared', P, `Shared the Care Passport with ${to} (${shareDraft.items.join(', ')}), never the result`); }, t.shMade);
    });
    on('do-hard', () => done(() => setBarrier(state, c.id, pick('bar'), P), t.saved));
    on('do-how', () => done(() => setChannel(state, c.id, pick('ch'), P), t.saved));
    const sh = $('#sheet'); if (sh && !sh.contains(document.activeElement)) sh.focus();
  }
  // the AI call
  on('answer', () => { call = { phase: 'ring', n: 0 }; render(); $('#caccept').focus(); });
  on('cdecline', () => { call = null; act(() => logEvent(c, 'call_attempt', { type: 'system', name: 'Falaj care line (AI call, simulated)' }, 'Declined. Falaj tries again outside working hours.'), lang === 'ar' ? 'سنحاول مرة أخرى لاحقاً.' : 'Falaj will try again later.'); render(); });
  on('caccept', () => {
    const { lines } = callLines(c, lang);
    const fast = new URLSearchParams(location.search).get('fast') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
    call = { phase: 'live', n: 1 }; render();
    const fin = () => { clearInterval(callTimer); call = { phase: 'done', n: lines.length }; render(); $('#cclose').focus(); };
    if (fast) fin(); else callTimer = setInterval(() => { if (call.n + 1 >= lines.length) fin(); else { call.n++; render(); } }, 1400);
  });
  on('cclose', () => {
    const { hold } = callLines(c, lang); call = null;
    act(() => {
      logEvent(c, 'contact', { type: 'system', name: 'Falaj care line (AI call, simulated)' }, `AI call. Visit held: ${hold.day} ${hold.time}, to be confirmed by the nurse.`);
      c.hold = hold;
      requestNurse(state, c.id, P, 'Asked "Is it something bad?" during the Falaj call');
    }, lang === 'ar' ? 'تم. سيتصل بك الممرض اليوم.' : 'Done. Your nurse will call you today.');
    render();
  });
}
if (new URLSearchParams(location.search).get('reset') === '1') { resetState(); state = loadState(); }
render();
</script>
</body>
</html>
