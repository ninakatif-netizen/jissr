<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falaj care team</title>
<meta name="description" content="The Falaj care team app: who needs you, why, and the one thing to do. Every patient is water flowing to care. Synthetic data only.">
<meta name="theme-color" content="#f6f2ea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="ios.css">
<link rel="stylesheet" href="design/system.css">
<link rel="stylesheet" href="design/glass-all.css">
</head>
<body data-falaj-surface="patient" data-falaj-page="team">
<div class="stage">
  <div class="phone" id="phone">
    <div class="inner" id="inner" tabindex="0" role="region" aria-label="Care team app">
      <header class="bar" id="bar"></header>
      <main id="main" tabindex="-1"></main>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </div>
    <div id="sheetroot"></div>
  </div>
</div>
<p class="sr" aria-live="polite" id="say"></p>

<script type="module">
// THE CARE TEAM APP. One question on every screen: which patient needs me, why, and what is the one thing to do?
// Every action goes through the rules engine (core/cases.mjs): who may record what, in which order.
// Picking a person is a demo, not a sign-in.
import { registerSW } from './core/pwa.mjs';
import { loadState, saveState, resetState } from './core/store.mjs';
import { isOverdue, mustCall, slotsFor, addDays } from './core/rules.mjs';
import { advance, skipStage, sendReferral, respondReferral, completeReferral, closeCase, logContact, logEvent, nextStageOf, createCase } from './core/cases.mjs';
import { progOf, resultText, targetsFor } from './core/programmes.mjs';
import { channelHtml } from './core/channel.mjs';
import { workflowHtml } from './core/workflow.mjs';
import { flowOf, flowSvg, levelOf, CHANNELS } from './core/flow.mjs';
import { runAgents, agentSummary, AGENTS, readDocument, SAMPLE_DOCUMENTS } from './core/agents.mjs';
import { missingResults, askLab } from './core/checkpoint.mjs';
registerSW();

let state = loadState();
const TODAY = state.today;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = (d, long) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' } : { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const say = (t) => { $('#say').textContent = t; };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* blocked */ } } };
const LANG = { ar: 'Arabic', en: 'English', ur: 'Urdu', hi: 'Hindi', tl: 'Tagalog', bn: 'Bengali', ml: 'Malayalam' };
const SHORT = { hba1c: 'HbA1c', fit: 'Bowel test (FIT)', mammo: 'Mammogram' };
const COLORS = { nurse: '#8a5412', coordinator: '#6b5a2e', gp: '#1a7f52', spec: '#6b3fa0' };

// ---- who am I ----
const staffOf = (id) => state.staff.find((s) => s.id === id);
const isGP = (s) => s && s.role === 'clinician' && s.org === 'Primary care clinic';
const isSpec = (s) => s && s.role === 'clinician' && !isGP(s);
const kindOf = (s) => (isGP(s) ? 'gp' : isSpec(s) ? 'spec' : s.role);
const roleLabel = (s) => (isGP(s) ? 'Family doctor' : isSpec(s) ? `Specialist · ${s.org}` : s.role === 'nurse' ? 'Nurse navigator' : 'Care coordinator');
const cleanName = (n) => n.replace(/\s*\(coordinator\)/, '');
const initials = (n) => cleanName(n).replace(/^(Nurse|Dr)\s+/, '').split(' ').map((w) => w[0]).slice(0, 2).join('');
const actorOf = (s) => ({ type: 'staff', ...s });
const first = (c) => c.patient.name.split(' ')[0];

// ---- navigation: everything lives in the URL, so Back works like in any app ----
function params() { const q = new URLSearchParams(location.search); return { as: q.get('as') || store.get('falaj.team.as') || '', c: q.get('c') || '', tab: q.get('tab') || 'attention' }; }
function nav(p, push = true) {
  const cur = params(), next = { ...cur, ...p };
  const q = new URLSearchParams(); if (next.as) q.set('as', next.as); if (next.c) q.set('c', next.c); if (next.tab && next.tab !== 'attention') q.set('tab', next.tab);
  const url = location.pathname + (q.toString() ? '?' + q : '');
  if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
  sheet = null; render(); $('#inner').scrollTop = 0; scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true });
}
addEventListener('popstate', () => { sheet = null; render(); });

// ---- what needs each person: reason + the one action, most urgent first ----
function tasksFor(s) {
  const open = state.cases.filter((c) => c.stage !== 'closed'), out = [], waiting = [];
  const T = (c, reason, action, pri) => out.push({ c, reason, action, pri, late: isOverdue(c, TODAY) });
  if (s.role === 'nurse' || s.role === 'coordinator') {
    for (const c of open.filter((x) => x.owner === s.id)) {
      if (c.nurseRequest && !c.nurseRequest.done) T(c, /^Agent:/.test(c.nurseRequest.note || '') ? 'From the agent: ' + c.nurseRequest.note.replace(/^Agent:\s*/, '') : /^Patient:/.test(c.nurseRequest.note || '') ? 'From the patient: ' + c.nurseRequest.note.replace(/^Patient:\s*/, '').replace(/\s*".*$/, '') : 'Asked to talk to a nurse', 'Call today', 0);
      else if (['result', 'notified'].includes(c.stage)) T(c, mustCall(c) ? 'Not reached yet · must be told by a person' : 'Not reached yet', 'Call', mustCall(c) ? 1 : 2);
      else if (c.stage === 'understood') T(c, 'Understood · no visit booked', 'Book the visit', 3);
      else if (c.stage === 'booked' && c.slot && c.slot.day <= TODAY) T(c, `Visit was due ${fmt(c.slot.day)}`, 'Confirm the visit', 3);
      else if (c.stage === 'booked') waiting.push({ c, reason: c.slot ? `Visit ${fmt(c.slot.day)} · ${c.slot.time}` : 'Visit booked' });
      else waiting.push({ c, reason: c.referral ? `With ${c.referral.to}` : 'With the family doctor' });
    }
  }
  if (isGP(s)) {
    for (const c of open) {
      const r = c.referral;
      if (c.stage === 'booked' && c.slot && c.slot.day <= TODAY) T(c, `Visit was due ${fmt(c.slot.day)}`, 'Record the visit', 3);
      else if (['attended', 'confirmed'].includes(c.stage) && !r) T(c, 'Seen · next step to decide', 'Decide', 1);
      else if (r && r.status === 'rejected') T(c, `Referral declined by ${r.to}`, 'Refer again', 0);
      else if (r && r.status === 'completed' && c.stage === 'referred') T(c, `Report back from ${r.to}`, 'Agree the plan', 1);
      else if (c.stage === 'care_plan') T(c, 'Plan agreed · loop still open', 'Close with evidence', 2);
      else if (r && r.status === 'sent') waiting.push({ c, reason: `Waiting for ${r.to} to accept · you stay responsible` });
      else if (r && r.status === 'accepted') waiting.push({ c, reason: `Accepted by ${r.to}` });
    }
  }
  if (isSpec(s)) {
    for (const c of open.filter((x) => x.referral && x.referral.to === s.org)) {
      if (c.referral.status === 'sent') T(c, 'Referral waiting for your answer', 'Accept or decline', 0);
      else if (c.referral.status === 'accepted') T(c, 'Accepted · consultation to confirm', 'Consultation', 1);
    }
  }
  out.sort((a, b) => a.pri - b.pri || (b.late - a.late) || (a.c.due || '').localeCompare(b.c.due || ''));
  return { tasks: out, waiting };
}
function casesFor(s) {
  if (s.role === 'nurse' || s.role === 'coordinator') return state.cases.filter((c) => c.owner === s.id);
  if (isGP(s)) return state.cases.filter((c) => ['booked', 'attended', 'confirmed', 'referred', 'care_plan', 'closed'].includes(c.stage) && (c.stage !== 'booked' || (c.slot && c.slot.day <= addDays(TODAY, 7))));
  return state.cases.filter((c) => c.referral && c.referral.to === s.org);
}

// ---- the one action on a case, for this person, by the rules ----
function actionFor(s, c) {
  const r = c.referral, n = first(c);
  if (c.stage === 'closed') return { info: ['ok', 'Loop closed', `Closed by ${c.closed ? c.closed.by : 'a clinician'}. The water reached the palm.`] };
  if ((s.role === 'nurse' || s.role === 'coordinator') && c.owner === s.id) {
    if (c.nurseRequest && !c.nurseRequest.done) return { title: `Call ${n} today`, text: /already happened/.test(c.nurseRequest.note || '') ? `${n} says this step already happened. Confirm it with ${n}, then record it.` : /^Patient:/.test(c.nurseRequest.note || '') ? `${n} says they are still waiting, past the date they were given.` : `${n} asked to talk to a nurse.`, btns: [['call', `Call ${n}`, 'go']] };
    if (['result', 'notified'].includes(c.stage)) return { title: `Call ${n}`, text: mustCall(c) || `${n} has not been reached yet. Explain the result and check they understood.`, btns: [['call', `Call ${n}`, 'go']] };
    if (c.stage === 'understood') return { title: 'Book the visit', text: `${n} understood. Help to choose a time.`, btns: [['book', 'Choose a time']] };
    if (c.stage === 'booked') return c.slot && c.slot.day <= TODAY ? { title: 'Did the visit happen?', text: `Visit was due ${fmt(c.slot.day)}, ${c.slot.time}.`, btns: [['attended', 'Yes, the visit happened'], ['call', `No: call ${n}`, 'ghost']] }
      : { info: ['wait', 'Visit booked', c.slot ? `${fmt(c.slot.day, true)} at ${c.slot.time}. A reminder goes the day before.` : 'A reminder goes the day before.'] };
  }
  if (isGP(s)) {
    if (c.stage === 'booked') return { title: 'Record the visit', text: c.slot ? `Visit ${fmt(c.slot.day)}, ${c.slot.time}.` : '', btns: [['attended', `${n} was seen`]] };
    if (['attended', 'confirmed'].includes(c.stage) && !r) return { title: 'Decide the next step', text: `${n} was seen. Refer, or record that no referral is needed.`, btns: [['refer', 'Refer to a specialist'], ...(c.stage === 'attended' ? [['confirmed', 'Confirmatory test done', 'ghost']] : []), ['noref', 'No referral needed', 'ghost']] };
    if (r && r.status === 'rejected') return { title: 'Refer again', text: `${r.to} declined: ${r.note || ''}`, btns: [['refer', 'Refer again']] };
    if (r && r.status === 'sent') return { info: ['wait', `Waiting for ${r.to}`, `Sent ${fmt(r.sentAt.slice(0, 10))}. You stay responsible until they accept.`] };
    if (r && r.status === 'accepted') return { info: ['wait', `With ${r.to}`, 'They own the case now. You will get their report.'] };
    if (r && r.status === 'completed' && c.stage === 'referred') return { title: 'Agree the plan', text: `Report back: ${r.report || ''}`, btns: [['plan', 'Agree the plan with ' + n]] };
    if (c.stage === 'care_plan') return { title: 'Close the loop', text: 'Write what was seen, decided and booked.', btns: [['close', 'Close with evidence', 'go']] };
  }
  if (isSpec(s) && r && r.to === s.org) {
    if (r.status === 'sent') return { title: 'Accept this referral?', text: `${r.reason}${r.shared ? ` · Shared by ${n}: ${r.shared.join(', ')}` : ''}`, btns: [['accept', 'Accept: we take responsibility', 'go'], ['decline', 'Decline', 'ghost']] };
    if (r.status === 'accepted') return { title: 'Consultation', text: `${n} is with you. Confirm the consultation to close the loop, or report back to the family doctor.`, btns: [['consult', 'Start consultation']] };
  }
  const o = staffOf(c.owner);
  return { info: ['wait', 'Nothing for you here', `${o ? cleanName(o.name) : 'The care team'} is responsible. Next: ${nextStageOf(c) || ''}.`] };
}

// ---- doing it: every action is a rule-checked engine call, then saved ----
function act(fn, msg) {
  try { fn(); saveState(state); toast(msg); return true; }
  catch (e) { sheetErr = e.message; render(); return false; }
}
let toastT = null;
function toast(msg) { say(msg); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }

const ACTIONS_NEXT = { notified: 'reach the patient', understood: 'confirm understanding', booked: 'book the visit', attended: 'the visit', confirmed: 'confirmatory test', referred: 'referral decision', care_plan: 'agree the plan', closed: 'close the loop' };
const EVENT = { result: 'Result from the lab', notified: 'Message sent', contact: 'Talked with the patient', call_attempt: 'Call attempt', understood: 'Understanding confirmed', booked: 'Visit booked', attended: 'Seen', confirmed: 'Confirmatory test', referred: 'Referred', referral_accepted: 'Referral accepted', referral_rejected: 'Referral declined', referral_completed: 'Report back', care_plan: 'Plan agreed', closed: 'Loop closed', nurse_requested: 'Asked for a nurse', barrier: 'Said what makes it hard', channel: 'Chose how to be contacted', confidence: 'Confidence', owner: 'Owner changed', agent: 'Falaj agent', consult_asked: 'Question to a specialist', consult_answered: 'Specialist answered', micro_consult_booked: 'Nurse call booked', micro_consult_done: 'Nurse call done', family: 'Family helper', shared: 'Passport shared', share_stopped: 'Sharing stopped', rebooked: 'Visit moved', sop_unread_outreach: 'Protocol: message not read', sop_stalled_referral: 'Protocol: referral stalled', sop_refusal: 'Protocol: refusal', drop_reason: 'Reason for delay' };

// ---- screens ----
const icon = {
  water: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9c3 0 3-2 6-2s3 2 6 2 3-2 6-2M2 15c3 0 3-2 6-2s3 2 6 2 3-2 6-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 15v6M15 18l3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>',
  list: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  bell: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  person: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};
const logo = '<svg width="26" height="20" viewBox="0 0 34 26" aria-hidden="true"><path d="M2 20c6 0 8-12 15-12s9 12 15 12" fill="none" stroke="#0b6fa8" stroke-width="3" stroke-linecap="round"/><path d="M27 9V3M24 5l3-2 3 2" fill="none" stroke="#1a7f52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const avatar = (s, lg) => `<span class="av${lg ? ' lg' : ''}" style="background:${COLORS[kindOf(s)]}" aria-hidden="true">${initials(s.name)}</span>`;
const taskRow = (t) => `<li><a class="prow" href="?as=${params().as}&c=${t.c.id}" data-case="${t.c.id}"><span class="t"><b>${esc(first(t.c))}, ${t.c.patient.age}</b><small>${SHORT[t.c.programme || 'hba1c']} · ${esc(t.reason)}</small><small style="color:var(--ink);font-weight:600">${esc(t.action)}</small></span>${t.late ? '<span class="st amber">Overdue</span>' : ''}</a></li>`;

function pickScreen() {
  const groups = [['Nurses', (s) => s.role === 'nurse'], ['Care coordinators', (s) => s.role === 'coordinator'], ['Family doctors', isGP], ['Specialists', isSpec]];
  return `<div class="head"><h1>Who are you?</h1><p class="ctx">Pick a person to open their app. In the demo there is no sign-in.</p></div>
    ${groups.map(([g, f]) => `<div class="group"><div class="gh">${g}</div><ul class="list">${state.staff.filter(f).map((s) => { const n = tasksFor(s).tasks.length; return `<li><a class="prow" href="?as=${s.id}" data-as="${s.id}">${avatar(s, true)}<span class="t"><b>${esc(cleanName(s.name))}</b><small>${esc(roleLabel(s))}</small></span>${n ? `<span class="st amber">${n} to do</span>` : ''}</a></li>`; }).join('')}</ul></div>`).join('')}
    <p class="demo-note">Synthetic patients only. <a href="me.html" style="color:var(--tint)">Open the patient app instead</a></p>`;
}
let flowSel = 'needs', scope = 'mine';
const scopeCases = (s) => (scope === 'all' ? state.cases : casesFor(s));
function flowRow(c, act) {
  const last = c.events[c.events.length - 1], pct = Math.round((levelOf(c) / (CHANNELS.length - 1)) * 100), late = isOverdue(c, TODAY);
  return `<li><a class="prow" href="?as=${params().as}&c=${c.id}" data-case="${c.id}"><span class="t"><b>${esc(first(c))}, ${c.patient.age}</b><small>${SHORT[c.programme || 'hba1c']} · ${esc(EVENT[last.type] || last.type)} · ${fmt(last.at.slice(0, 10))}</small>
    <span class="prog" role="img" aria-label="${pct}% of the way"><span style="width:${pct}%"></span></span>${act ? `<small style="color:var(--ink);font-weight:600">${esc(act)}</small>` : ''}</span>${c.stage === 'closed' ? '<span class="st green">Closed</span>' : late ? '<span class="st amber">Overdue</span>' : '<span class="st grey">On time</span>'}</a></li>`;
}
// The agents, in one line: what they did overnight. The + opens the rest (new document, run them, every action).
function agentLine(s) {
  const a = agentSummary(scopeCases(s), TODAY);
  const txt = a.items.length
    ? `Overnight, Falaj made ${a.calls} ${a.calls === 1 ? 'call' : 'calls'}${a.confirmed ? `, confirmed ${a.confirmed} ${a.confirmed === 1 ? 'visit' : 'visits'}` : ''}${a.chased ? `, chased ${a.chased} ${a.chased === 1 ? 'referral' : 'referrals'}` : ''}, and passed ${a.flagged} to a person.`
    : 'The Falaj agents have not run today.';
  return `<div class="agline"><span>${txt}</span><button id="agents-more" aria-label="Agents and new documents" aria-haspopup="dialog">+</button></div>`;
}
// THE FALAJ: one channel per row, as wide as the patients who reached it; tap a channel to see who stopped there.
function attentionScreen(s) {
  const { tasks, waiting } = tasksFor(s);
  const fl = flowOf(scopeCases(s), TODAY), sel = flowSel === 'needs' ? null : +flowSel, top = tasks[0];
  const lateAll = fl.leaks.reduce((n, l) => n + l.late, 0), max = Math.max(1, fl.total);
  const rows = CHANNELS.map((ch, i) => {
    const lk = fl.leaks[i], w = Math.round((fl.counts[i] / max) * 100), last = i === CHANNELS.length - 1;
    const inner = `<span class="lbl">${esc(ch.label)}</span><span class="fbar${last ? ' end' : ''}"><span style="width:${w}%"></span></span><b>${fl.counts[i]}</b>${lk && lk.cases.length ? `<span class="stop${lk.late ? ' late' : ''}">${lk.cases.length} stopped here${lk.late ? `, ${lk.late} overdue` : ''}</span>` : ''}`;
    const open = sel === i && lk;
    const list = open ? `<ul class="list stopped" aria-label="Stopped after ${esc(ch.label)}">${lk.cases.slice().sort((x, y) => isOverdue(y, TODAY) - isOverdue(x, TODAY)).map((c) => flowRow(c, lk.act)).join('')}</ul>` : '';
    return `<li>${lk && lk.cases.length ? `<button class="ch" data-flow="${i}" aria-expanded="${!!open}">${inner}</button>` : `<div class="ch">${inner}</div>`}${list}</li>`;
  }).join('');
  return `<div class="head"><p class="who">${avatar(s)}${esc(cleanName(s.name))} · ${esc(roleLabel(s))}</p><h1>The Falaj</h1><p class="ctx">${fl.total} patients · ${fl.counts[fl.counts.length - 1]} loops closed${lateAll ? ` · <b style="color:var(--warn-ink)">${lateAll} overdue</b>` : ''}</p></div>
    <div class="seg" role="group" aria-label="Whose patients"><button data-scope="mine" aria-pressed="${scope === 'mine'}">Mine</button><button data-scope="all" aria-pressed="${scope === 'all'}">Everyone</button></div>
    <ol class="falaj" aria-label="The falaj: patients from result to loop closed. Tap a channel to see who stopped there.">${rows}</ol>
    ${agentLine(s)}
    ${(() => { const m = missingResults(TODAY, state.labAsks || {}); return m.length ? `<div class="group" id="missing"><div class="gh">Tests done, no result yet · ${m.length}</div><ul class="list">${m.map((x) => `<li><div class="prow"><span class="t"><b>${esc(x.name)}, ${x.age}</b><small>${esc(x.test)} at ${esc(x.lab)} · done ${x.ago} days ago, result expected within ${x.expected}</small></span>${x.asked ? `<span class="due">Lab asked</span>` : `<button class="light" data-asklab="${x.id}">Ask the lab</button>`}</div></li>`).join('')}</ul><div class="gf">A result that never arrives cannot start a falaj, so Falaj also watches the tests. Simulated list; times are proposals.</div></div>` : ''; })()}
    <div class="group"><div class="gh">Needs you · ${tasks.length}</div>
    ${top ? `<div class="hl"><div class="top"><b>${esc(first(top.c))}, ${top.c.patient.age} · ${LANG[top.c.patient.language] || ''}</b><span class="st amber">${top.late ? 'Overdue' : 'First'}</span></div>
      <p class="q">${SHORT[top.c.programme || 'hba1c']} · ${esc(top.reason)}</p><a class="wide" href="?as=${s.id}&c=${top.c.id}" data-case="${top.c.id}">${esc(top.action)}</a></div>` : `<div class="card empty"><b>Nothing needs you right now</b>New results, referrals and reports appear here, most urgent first.</div>`}
    ${tasks.length > 1 ? `<ul class="list">${tasks.slice(1).map(taskRow).join('')}</ul>` : ''}</div>
    ${waiting.length ? `<details class="more"><summary>Waiting on others (${waiting.length})</summary><ul class="list">${waiting.map((w) => `<li><a class="prow" href="?as=${s.id}&c=${w.c.id}" data-case="${w.c.id}"><span class="t"><b>${esc(first(w.c))}, ${w.c.patient.age}</b><small>${esc(w.reason)}</small></span></a></li>`).join('')}</ul></details>` : ''}`;
}
function patientsScreen(s) {
  const list = casesFor(s);
  return `<div class="head"><p class="who">${avatar(s)}${esc(cleanName(s.name))}</p><h1>Patients</h1><p class="ctx">${list.length} in your falaj</p></div>
    <label class="sr" for="find">Find a patient</label><input class="search" id="find" type="search" placeholder="Find a patient" autocomplete="off" value="${esc(findText)}">
    <ul class="list" id="plist">${list.filter((c) => !findText || c.patient.name.toLowerCase().includes(findText.toLowerCase())).map((c) => {
      const tone = c.stage === 'closed' ? ['green', 'Loop closed'] : isOverdue(c, TODAY) ? ['amber', 'Overdue'] : ['grey', 'In progress'];
      return `<li><a class="prow" href="?as=${s.id}&c=${c.id}" data-case="${c.id}"><span class="t"><b>${esc(c.patient.name)}, ${c.patient.age}</b><small>${SHORT[c.programme || 'hba1c']} · ${esc(EVENT[c.stage] || c.stage)}</small></span><span class="st ${tone[0]}">${tone[1]}</span></a></li>`;
    }).join('') || '<li class="empty">No patients yet.</li>'}</ul>`;

}
function emptyDetail(s) {
  const top = tasksFor(s).tasks[0];
  return `<div class="dempty"><svg width="120" height="64" viewBox="0 0 120 64" aria-hidden="true"><path d="M4 50c20 0 22-34 46-34s26 34 46 34h20" fill="none" stroke="#0b6fa8" stroke-width="5" stroke-linecap="round"/><path d="M4 50c20 0 22-34 46-34s26 34 46 34h20" fill="none" stroke="#d6f3fc" stroke-width="2" stroke-dasharray="4 10" class="dflow"/></svg>
    <h2>Open a patient to see their falaj</h2><p>Every lab, call, visit and referral appears as a step, with who did it and when. The water shows how far they have come.</p>
    ${top ? `<a class="wide" href="?as=${s.id}&c=${top.c.id}" data-case="${top.c.id}" style="max-width:320px">Start with ${esc(first(top.c))}: ${esc(top.action)}</a>` : ''}</div>`;
}
function render() {
  state = loadState();
  const wantFresh = freshShaft === 'last';
  const p = params(), s = staffOf(p.as), c = p.c ? state.cases.find((x) => x.id === p.c) : null;
  $('#bar').innerHTML = `<a class="brand" href="index.html" aria-label="Falaj home">${logo} Falaj</a>${s ? `<button class="light" id="switch">Switch person</button>` : '<span class="chip">Care team · demo</span>'}`;
  if (!s) { document.body.classList.remove('web'); lastDesk = DESK(); $('#main').innerHTML = pickScreen(); $('#tabs').hidden = true; }
  else {
    store.set('falaj.team.as', s.id);
    lastDesk = DESK();
    document.body.classList.toggle('web', lastDesk);
    $('#main').innerHTML = lastDesk
      ? `<div class="desk">${sideNav(s, p, c)}<section class="pane plist" aria-label="${p.tab === 'patients' ? 'Patients' : 'The Falaj'}">${p.tab === 'patients' ? patientsScreen(s) : attentionScreen(s)}</section><section class="pane pdetail" aria-label="Patient file">${c ? caseScreen(actorOf(s), c) : emptyDetail(s)}</section></div>`
      : c ? caseScreen(actorOf(s), c) : p.tab === 'patients' ? patientsScreen(s) : attentionScreen(s);
    document.querySelectorAll('[data-case]').forEach((x) => { if (c && x.dataset.case === c.id) x.setAttribute('aria-current', 'true'); });
    const n = tasksFor(s).tasks.length;
    $('#tabs').hidden = false;
    $('#tabs').innerHTML = `<a href="?as=${s.id}" data-tab="attention"${!c && p.tab !== 'patients' ? ' aria-current="page"' : ''}>${icon.water}Falaj${n ? `<span class="badge" aria-label="${n} to do">${n}</span>` : ''}</a><a href="?as=${s.id}&tab=patients" data-tab="patients"${!c && p.tab === 'patients' ? ' aria-current="page"' : ''}>${icon.list}Patients</a>`;
  }
  $('#sheetroot').innerHTML = intake && s ? intakeHtml(s) : sheet && s && c ? sheetHtml(actorOf(s), c) : '';
  ['#bar', '#main', '#tabs'].forEach((x) => { $(x).inert = !!((sheet && c) || (intake && s)); });
  // wiring
  document.querySelectorAll('[data-case]').forEach((a) => a.onclick = (e) => { e.preventDefault(); nav({ c: a.dataset.case }); });
  document.querySelectorAll('[data-as]').forEach((a) => a.onclick = (e) => { e.preventDefault(); nav({ as: a.dataset.as, c: '', tab: 'attention' }); });
  document.querySelectorAll('[data-tab]').forEach((a) => a.onclick = (e) => { e.preventDefault(); nav({ c: '', tab: a.dataset.tab }); });
  ['#agents-more', '#side-agents'].forEach((sel) => { const am = $(sel); if (am) am.onclick = () => { intake = { step: 'menu', err: '' }; render(); }; });
  document.querySelectorAll('[data-flow]').forEach((b) => b.onclick = () => { flowSel = flowSel === b.dataset.flow ? 'needs' : b.dataset.flow; render(); const x = document.querySelector(`[data-flow="${flowSel}"]`); if (x) x.focus(); });
  document.querySelectorAll('[data-asklab]').forEach((b) => b.onclick = () => { state = loadState(); askLab(state, b.dataset.asklab, s); saveState(state); toast('The lab has been asked for the result (simulated)'); render(); });
  document.querySelectorAll('[data-scope]').forEach((b) => b.onclick = () => { scope = b.dataset.scope; render(); const x = document.querySelector(`[data-scope="${scope}"]`); if (x) x.focus(); });
  const sw = $('#switch'); if (sw) sw.onclick = () => { store.set('falaj.team.as', ''); history.pushState(null, '', location.pathname + '?as='); sheet = null; render(); };
  const bk = $('#back'); if (bk) bk.onclick = () => nav({ c: '' });
  const f = $('#find'); if (f) f.oninput = () => { findText = f.value; const pos = f.selectionStart; render(); const g = $('#find'); g.focus(); g.setSelectionRange(pos, pos); };
  document.querySelectorAll('.wf-n[data-node]').forEach((b) => b.onclick = () => { const i = b.dataset.node; shaftSel = shaftSel === i ? null : i; const sc = document.querySelector('.wf-wrap'); const keep = sc ? [sc.scrollLeft, sc.scrollTop] : null; render(); const w = document.querySelector('.wf-wrap'); if (w && keep) { w.scrollLeft = keep[0]; w.scrollTop = keep[1]; } const x = document.querySelector(`.wf-n[data-node="${i}"]`); if (x) x.focus({ preventScroll: true }); });
  document.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => {
    const id = b.dataset.act, a = actorOf(s);
    if (id === 'attended') return void (act(() => advance(state, c.id, 'attended', a, 'Seen.'), 'Visit recorded.') && render());
    if (id === 'confirmed') return void (act(() => advance(state, c.id, 'confirmed', a, 'Confirmatory test done.'), 'Test recorded.') && render());
    if (id === 'add') { sheet = { kind: 'add', addk: 'lab' }; sheetErr = ''; render(); return; }
    if (id === 'accept') return void (act(() => respondReferral(state, c.id, a, { accept: true, note: 'Accepted.' }), 'Accepted. You are now the keeper.') && render());
    sheet = { kind: id }; sheetErr = ''; render();
  });
  if (intake && s) wireIntake(s);
  if (wantFresh) { freshShaft = null; }
  if (sheet && s && c) { wireSheet(actorOf(s), c); const sh = $('#sheet'); if (sh && !sh.contains(document.activeElement)) sh.focus(); }
}
if (new URLSearchParams(location.search).get('reset') === '1') { resetState(); state = loadState(); }
render();
</script>
</body>
